<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" role="img" aria-label="A backslash starts an instruction, not a character">
  <rect width="720" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">A backslash is an instruction, not a character</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">
    <text x="40" y="70" fill="#0f172a">print(<tspan fill="#d97706">"C:\Users\new"</tspan>)</text>
    <rect x="103" y="55" width="24" height="20" fill="none" stroke="#dc2626" stroke-width="2" rx="3"/>
    <rect x="163" y="55" width="24" height="20" fill="none" stroke="#dc2626" stroke-width="2" rx="3"/>
  </g>
  <text x="40" y="96" font-family="system-ui,sans-serif" font-size="12" fill="#991b1b">Python reads <tspan font-family="ui-monospace,monospace">\U</tspan> and <tspan font-family="ui-monospace,monospace">\n</tspan> as commands, not as letters. The path is destroyed.</text>

  <rect x="40" y="108" width="300" height="52" rx="5" fill="#0f172a"/>
  <text x="54" y="130" font-family="ui-monospace,monospace" font-size="13" fill="#f87171">SyntaxError / mangled output</text>
  <text x="54" y="150" font-family="ui-monospace,monospace" font-size="13" fill="#94a3b8">with a stray new line</text>

  <line x1="40" y1="180" x2="680" y2="180" stroke="#cbd5e1" stroke-width="1"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">
    <text x="40" y="208" fill="#0f172a">print(<tspan fill="#d97706">"C:\\Users\\new"</tspan>)</text>
  </g>
  <text x="40" y="232" font-family="system-ui,sans-serif" font-size="12" fill="#14532d">Two backslashes mean &#8220;an actual backslash&#8221;. Output: <tspan font-family="ui-monospace,monospace" font-weight="700">C:\Users\new</tspan></text>
</svg>
