<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220" role="img" aria-label="The edit, save, run, look loop">
  <rect width="720" height="220" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="34" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">The only loop there is</text>

  <g font-family="system-ui,sans-serif" font-size="14" font-weight="600">
    <rect x="40"  y="70" width="120" height="58" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="100" y="97"  text-anchor="middle" fill="#1e3a8a">EDIT</text>
    <text x="100" y="115" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">type in the file</text>

    <rect x="200" y="70" width="120" height="58" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="260" y="97"  text-anchor="middle" fill="#1e3a8a">SAVE</text>
    <text x="260" y="115" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">Ctrl+S / Cmd+S</text>

    <rect x="360" y="70" width="120" height="58" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="420" y="97"  text-anchor="middle" fill="#1e3a8a">RUN</text>
    <text x="420" y="115" text-anchor="middle" font-size="11" font-family="ui-monospace,monospace" font-weight="400" fill="#64748b">python3 file.py</text>

    <rect x="520" y="70" width="120" height="58" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="580" y="97"  text-anchor="middle" fill="#14532d">LOOK</text>
    <text x="580" y="115" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">read the output</text>
  </g>

  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#ar)">
    <path d="M160 99 H196"/>
    <path d="M320 99 H356"/>
    <path d="M480 99 H516"/>
    <path d="M580 128 V166 H100 V132"/>
  </g>
  <text x="340" y="186" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">was it what you meant? if not, go again</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
