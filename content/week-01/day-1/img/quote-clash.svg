<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="Why a quote inside a quote breaks, and two fixes">
  <rect width="720" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Python ends the string at the very next matching quote</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16">
    <rect x="30" y="52" width="660" height="76" rx="8" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
    <text x="50" y="82" fill="#0f172a">print(<tspan fill="#d97706">"She said "</tspan>hello<tspan fill="#d97706">"</tspan> and left.<tspan fill="#d97706">"</tspan>)</text>
    <rect x="96" y="66" width="98" height="22" fill="none" stroke="#16a34a" stroke-width="2" rx="3"/>
    <text x="50" y="112" font-family="system-ui,sans-serif" font-size="12" fill="#991b1b">Python sees the string as just <tspan font-family="ui-monospace,monospace">"She said "</tspan> &#8212; then <tspan font-family="ui-monospace,monospace">hello</tspan> is loose code. SyntaxError.</text>
  </g>

  <text x="30" y="158" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#14532d">Fix 1 &#8212; use different quotes on the outside</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16">
    <rect x="30" y="168" width="660" height="46" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="50" y="197" fill="#0f172a">print(<tspan fill="#d97706">'She said "hello" and left.'</tspan>)</text>
  </g>

  <text x="30" y="242" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#14532d">Fix 2 &#8212; escape the inner quotes with a backslash</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16">
    <rect x="30" y="252" width="660" height="40" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="50" y="278" fill="#0f172a">print(<tspan fill="#d97706">"She said <tspan fill="#2563eb">\"</tspan>hello<tspan fill="#2563eb">\"</tspan> and left."</tspan>)</text>
  </g>
</svg>
