<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" width="720" height="230" role="img" aria-label="The four basic Python types">
  <rect width="720" height="230" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">The four types you use every day</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">
    <rect x="24"  y="54" width="156" height="140" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <text x="102" y="82"  text-anchor="middle" font-size="17" font-weight="700" fill="#92400e">str</text>
    <text x="102" y="108" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#475569">text, in quotes</text>
    <text x="102" y="140" text-anchor="middle" fill="#0f172a">"Sam"</text>
    <text x="102" y="162" text-anchor="middle" fill="#0f172a">"4.50"</text>
    <text x="102" y="182" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#991b1b">you cannot add 1 to it</text>

    <rect x="196" y="54" width="156" height="140" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="274" y="82"  text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">int</text>
    <text x="274" y="108" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#475569">whole number</text>
    <text x="274" y="140" text-anchor="middle" fill="#0f172a">4</text>
    <text x="274" y="162" text-anchor="middle" fill="#0f172a">-17</text>
    <text x="274" y="182" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#475569">no decimal point</text>

    <rect x="368" y="54" width="156" height="140" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="446" y="82"  text-anchor="middle" font-size="17" font-weight="700" fill="#14532d">float</text>
    <text x="446" y="108" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#475569">number with a point</text>
    <text x="446" y="140" text-anchor="middle" fill="#0f172a">4.50</text>
    <text x="446" y="162" text-anchor="middle" fill="#0f172a">98.6</text>
    <text x="446" y="182" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#475569">money, averages</text>

    <rect x="540" y="54" width="156" height="140" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="618" y="82"  text-anchor="middle" font-size="17" font-weight="700" fill="#5b21b6">bool</text>
    <text x="618" y="108" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#475569">yes or no</text>
    <text x="618" y="140" text-anchor="middle" fill="#0f172a">True</text>
    <text x="618" y="162" text-anchor="middle" fill="#0f172a">False</text>
    <text x="618" y="182" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#991b1b">capital letter, no quotes</text>
  </g>
</svg>
