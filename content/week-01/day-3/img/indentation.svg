<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-label="Indentation decides what is inside the if">
  <rect width="720" height="260" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Indentation is the structure, not decoration</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">
    <rect x="30" y="52" width="320" height="150" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="48" y="80"  fill="#0f172a">if temp &gt; 30:</text>
    <rect x="48" y="88" width="30" height="46" fill="#bbf7d0" opacity="0.6"/>
    <text x="82" y="108" fill="#0f172a">print("Hot")</text>
    <text x="82" y="128" fill="#0f172a">print("Drink water")</text>
    <text x="48" y="156" fill="#0f172a">print("Done")</text>
    <text x="48" y="186" font-family="system-ui,sans-serif" font-size="11" fill="#14532d">Both indented lines are inside. <tspan font-family="ui-monospace,monospace">"Done"</tspan> always runs.</text>

    <rect x="374" y="52" width="316" height="150" rx="8" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
    <text x="392" y="80"  fill="#0f172a">if temp &gt; 30:</text>
    <text x="426" y="108" fill="#0f172a">print("Hot")</text>
    <text x="392" y="128" fill="#0f172a">print("Drink water")</text>
    <text x="392" y="186" font-family="system-ui,sans-serif" font-size="11" fill="#991b1b">No error &#8212; but the second line is <tspan font-weight="700">outside</tspan>. It runs</text>
    <text x="392" y="200" font-family="system-ui,sans-serif" font-size="11" fill="#991b1b">even at 5 degrees. A silent, real bug.</text>
  </g>

  <text x="360" y="234" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#0f172a">Four spaces per level. Never mix tabs and spaces.</text>
</svg>
