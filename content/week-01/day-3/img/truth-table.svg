<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" role="img" aria-label="Truth tables for and, or and not">
  <rect width="720" height="290" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">and / or / not &#8212; the whole truth</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">
    <text x="30"  y="62" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">and &#8212; both sides</text>
    <rect x="30" y="72" width="200" height="132" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <line x1="30" y1="98" x2="230" y2="98" stroke="#cbd5e1"/>
    <text x="46" y="91" fill="#64748b">A      B      &#8594;</text>
    <text x="46" y="119" fill="#0f172a">True   True   <tspan fill="#16a34a" font-weight="700">True</tspan></text>
    <text x="46" y="145" fill="#0f172a">True   False  <tspan fill="#dc2626">False</tspan></text>
    <text x="46" y="171" fill="#0f172a">False  True   <tspan fill="#dc2626">False</tspan></text>
    <text x="46" y="197" fill="#0f172a">False  False  <tspan fill="#dc2626">False</tspan></text>

    <text x="260" y="62" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">or &#8212; either side</text>
    <rect x="260" y="72" width="200" height="132" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <line x1="260" y1="98" x2="460" y2="98" stroke="#cbd5e1"/>
    <text x="276" y="91" fill="#64748b">A      B      &#8594;</text>
    <text x="276" y="119" fill="#0f172a">True   True   <tspan fill="#16a34a" font-weight="700">True</tspan></text>
    <text x="276" y="145" fill="#0f172a">True   False  <tspan fill="#16a34a" font-weight="700">True</tspan></text>
    <text x="276" y="171" fill="#0f172a">False  True   <tspan fill="#16a34a" font-weight="700">True</tspan></text>
    <text x="276" y="197" fill="#0f172a">False  False  <tspan fill="#dc2626">False</tspan></text>

    <text x="490" y="62" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">not &#8212; flips it</text>
    <rect x="490" y="72" width="200" height="132" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <line x1="490" y1="98" x2="690" y2="98" stroke="#cbd5e1"/>
    <text x="506" y="91" fill="#64748b">A             &#8594;</text>
    <text x="506" y="119" fill="#0f172a">True          <tspan fill="#dc2626">False</tspan></text>
    <text x="506" y="145" fill="#0f172a">False         <tspan fill="#16a34a" font-weight="700">True</tspan></text>
  </g>
  <text x="360" y="238" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#475569">&#8220;and&#8221; is fussy: one false ruins it. &#8220;or&#8221; is generous: one true saves it.</text>
  <text x="360" y="262" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#475569">Order of operations: <tspan font-family="ui-monospace,monospace">not</tspan> first, then <tspan font-family="ui-monospace,monospace">and</tspan>, then <tspan font-family="ui-monospace,monospace">or</tspan>. Use brackets and stop thinking about it.</text>
</svg>
