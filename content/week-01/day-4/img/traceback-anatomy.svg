<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-label="How to read a Python traceback, from the bottom up">
  <rect width="720" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Read a traceback from the BOTTOM UP</text>

  <rect x="30" y="50" width="430" height="150" rx="8" fill="#0f172a"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">
    <text x="44" y="72"  fill="#94a3b8">Traceback (most recent call last):</text>
    <text x="44" y="94"  fill="#94a3b8">  File "broken_3.py", line 2, in &lt;module&gt;</text>
    <text x="44" y="116" fill="#e2e8f0">    print("You are " + age + " years old.")</text>
    <text x="44" y="136" fill="#f87171">                       ~~~~~^~~~~</text>
    <text x="44" y="164" fill="#f87171">TypeError: can only concatenate str</text>
    <text x="44" y="182" fill="#f87171">(not "int") to str</text>
  </g>

  <g stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#a6)">
    <path d="M466 172 H500"/>
  </g>
  <g stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a7)">
    <path d="M466 100 H500"/><path d="M466 130 H500"/>
  </g>
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a8)">
    <path d="M466 68 H500"/>
  </g>

  <g font-family="system-ui,sans-serif" font-size="12">
    <text x="508" y="72"  fill="#64748b"><tspan font-weight="700">4th</tspan> &#8212; ignore for now</text>
    <text x="508" y="104" fill="#1e3a8a"><tspan font-weight="700">2nd</tspan> &#8212; WHICH line</text>
    <text x="508" y="134" fill="#1e3a8a"><tspan font-weight="700">3rd</tspan> &#8212; WHICH part</text>
    <text x="508" y="169" fill="#14532d"><tspan font-weight="700">1st</tspan> &#8212; WHAT went wrong</text>
    <text x="508" y="186" fill="#14532d">start here, always</text>
  </g>

  <rect x="30" y="220" width="660" height="88" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="48" y="245" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#14532d">In plain English, this traceback says:</text>
  <text x="48" y="270" font-family="system-ui,sans-serif" font-size="13" fill="#0f172a">&#8220;On line 2, you tried to join text to a number with <tspan font-family="ui-monospace,monospace">+</tspan>. I cannot do that.</text>
  <text x="48" y="292" font-family="system-ui,sans-serif" font-size="13" fill="#0f172a">The problem is the bit under the arrows: <tspan font-family="ui-monospace,monospace" font-weight="700">age</tspan>.&#8221;</text>

  <defs>
    <marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker>
    <marker id="a7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
    <marker id="a8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
  </defs>
</svg>
