<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" role="img" aria-label="List positions counted forwards from zero and backwards from minus one">
  <rect width="720" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Every list has two rulers</text>

  <text x="40" y="62" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#0f172a">names = ["Ana", "Ben", "Cara", "Dev", "Eve"]</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">
    <rect x="60"  y="110" width="110" height="46" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="115" y="139" text-anchor="middle" fill="#0f172a">"Ana"</text>
    <rect x="180" y="110" width="110" height="46" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="235" y="139" text-anchor="middle" fill="#0f172a">"Ben"</text>
    <rect x="300" y="110" width="110" height="46" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="355" y="139" text-anchor="middle" fill="#0f172a">"Cara"</text>
    <rect x="420" y="110" width="110" height="46" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="475" y="139" text-anchor="middle" fill="#0f172a">"Dev"</text>
    <rect x="540" y="110" width="110" height="46" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="595" y="139" text-anchor="middle" fill="#0f172a">"Eve"</text>
  </g>

  <text x="30" y="99" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#16a34a">forwards</text>
  <g font-family="ui-monospace,monospace" font-size="15" font-weight="700" fill="#16a34a" text-anchor="middle">
    <text x="115" y="99">0</text><text x="235" y="99">1</text><text x="355" y="99">2</text><text x="475" y="99">3</text><text x="595" y="99">4</text>
  </g>

  <text x="30" y="180" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#7c3aed">backwards</text>
  <g font-family="ui-monospace,monospace" font-size="15" font-weight="700" fill="#7c3aed" text-anchor="middle">
    <text x="115" y="180">-5</text><text x="235" y="180">-4</text><text x="355" y="180">-3</text><text x="475" y="180">-2</text><text x="595" y="180">-1</text>
  </g>

  <rect x="40" y="198" width="640" height="38" rx="6" fill="#fffbeb" stroke="#d97706"/>
  <text x="360" y="214" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#92400e">5 items &#8594; valid positions are 0,1,2,3,4. The last one is <tspan font-family="ui-monospace,monospace" font-weight="700">len(names) - 1</tspan>, never <tspan font-family="ui-monospace,monospace" font-weight="700">len(names)</tspan>.</text>
  <text x="360" y="230" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#92400e"><tspan font-family="ui-monospace,monospace">names[-1]</tspan> is the last item whatever the length. Prefer it over counting.</text>
</svg>
