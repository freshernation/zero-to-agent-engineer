<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" role="img" aria-label="The list methods that change a list in place">
  <rect width="720" height="290" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Changing a list &#8212; each of these edits the list you already have</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">
    <text x="30" y="62" fill="#64748b">start:  ["Ana", "Ben", "Cara"]</text>

    <rect x="30" y="76" width="325" height="60" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="46" y="99"  fill="#1e3a8a" font-weight="700">names.append("Dev")</text>
    <text x="46" y="122" fill="#0f172a">["Ana", "Ben", "Cara", <tspan fill="#16a34a" font-weight="700">"Dev"</tspan>]</text>

    <rect x="365" y="76" width="325" height="60" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="381" y="99"  fill="#1e3a8a" font-weight="700">names.insert(0, "Zoe")</text>
    <text x="381" y="122" fill="#0f172a">[<tspan fill="#16a34a" font-weight="700">"Zoe"</tspan>, "Ana", "Ben", "Cara"]</text>

    <rect x="30" y="150" width="325" height="60" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <text x="46" y="173"  fill="#92400e" font-weight="700">names.remove("Ben")</text>
    <text x="46" y="196" fill="#0f172a">["Ana", "Cara"]  <tspan font-size="11" fill="#991b1b">by value</tspan></text>

    <rect x="365" y="150" width="325" height="60" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <text x="381" y="173"  fill="#92400e" font-weight="700">last = names.pop()</text>
    <text x="381" y="196" fill="#0f172a">["Ana", "Ben"]  <tspan font-size="11" fill="#991b1b">hands "Cara" back</tspan></text>

    <rect x="30" y="224" width="660" height="52" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="46" y="247" fill="#14532d" font-weight="700">names[1] = "Bella"</text>
    <text x="240" y="247" fill="#0f172a">["Ana", <tspan fill="#16a34a" font-weight="700">"Bella"</tspan>, "Cara"]</text>
    <text x="46" y="267" font-family="system-ui,sans-serif" font-size="11" fill="#14532d">Assigning to a position replaces that item. Strings cannot do this &#8212; lists can.</text>
  </g>
</svg>
