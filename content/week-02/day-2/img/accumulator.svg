<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-label="The accumulator pattern and the two ways to get it wrong">
  <rect width="720" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">The accumulator &#8212; where you put <tspan font-family="ui-monospace,monospace">total = 0</tspan> is the whole game</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">
    <rect x="20" y="44" width="222" height="150" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="131" y="66" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#14532d">RIGHT</text>
    <text x="34" y="92"  fill="#16a34a" font-weight="700">total = 0</text>
    <text x="34" y="114" fill="#0f172a">for price in prices:</text>
    <text x="34" y="136" fill="#0f172a">    total += price</text>
    <text x="34" y="158" fill="#0f172a">print(total)</text>
    <rect x="34" y="168" width="192" height="20" rx="3" fill="#0f172a"/>
    <text x="44" y="183" font-size="12" fill="#4ade80">19.75</text>

    <rect x="250" y="44" width="222" height="150" rx="8" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
    <text x="361" y="66" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#991b1b">WRONG &#8212; reset inside</text>
    <text x="264" y="92"  fill="#0f172a">for price in prices:</text>
    <text x="264" y="114" fill="#dc2626" font-weight="700">    total = 0</text>
    <text x="264" y="136" fill="#0f172a">    total += price</text>
    <text x="264" y="158" fill="#0f172a">print(total)</text>
    <rect x="264" y="168" width="192" height="20" rx="3" fill="#0f172a"/>
    <text x="274" y="183" font-size="12" fill="#f87171">3.25  &#8592; only the last one</text>

    <rect x="480" y="44" width="222" height="150" rx="8" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
    <text x="591" y="66" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#991b1b">WRONG &#8212; assign, not add</text>
    <text x="494" y="92"  fill="#0f172a">total = 0</text>
    <text x="494" y="114" fill="#0f172a">for price in prices:</text>
    <text x="494" y="136" fill="#dc2626" font-weight="700">    total = price</text>
    <text x="494" y="158" fill="#0f172a">print(total)</text>
    <rect x="494" y="168" width="192" height="20" rx="3" fill="#0f172a"/>
    <text x="504" y="183" font-size="12" fill="#f87171">3.25  &#8592; only the last one</text>
  </g>

  <rect x="20" y="212" width="682" height="46" rx="6" fill="#fffbeb" stroke="#d97706"/>
  <text x="361" y="232" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#92400e">Both wrong versions run happily and print a plausible number. <tspan font-weight="700">No error message.</tspan></text>
  <text x="361" y="250" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#92400e">This is why you work out the expected answer before you run the program.</text>

  <text x="20" y="284" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#0f172a">The shape is always the same &#8212; and it builds lists too:</text>
  <g font-family="ui-monospace,monospace" font-size="13">
    <text x="20" y="306" fill="#16a34a" font-weight="700">expensive = []</text>
    <text x="200" y="306" fill="#0f172a">for p in prices:</text>
    <text x="370" y="306" fill="#0f172a">if p &gt; 5:</text>
    <text x="480" y="306" fill="#0f172a">expensive.append(p)</text>
  </g>
  <text x="20" y="324" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">BEFORE: start empty &#183; INSIDE: grow it &#183; AFTER: use it</text>
</svg>
