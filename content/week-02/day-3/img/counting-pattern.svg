<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-label="The counting pattern walked through step by step">
  <rect width="720" height="280" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">The counting pattern: &#8220;seen it before? add one. Never seen it? start at one.&#8221;</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">
    <text x="30" y="58" fill="#64748b">words = ["apple", "banana", "apple"]</text>
  </g>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">
    <rect x="30" y="76" width="150" height="90" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="105" y="96" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#475569">start</text>
    <text x="105" y="126" text-anchor="middle" fill="#0f172a">counts = {}</text>

    <rect x="204" y="76" width="150" height="90" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="279" y="96" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#1e3a8a">"apple" &#8212; new</text>
    <text x="279" y="126" text-anchor="middle" fill="#0f172a">{"apple": 1}</text>
    <text x="279" y="148" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">start at one</text>

    <rect x="378" y="76" width="150" height="90" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="453" y="96" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#1e3a8a">"banana" &#8212; new</text>
    <text x="453" y="120" text-anchor="middle" font-size="11" fill="#0f172a">{"apple": 1,</text>
    <text x="453" y="136" text-anchor="middle" font-size="11" fill="#0f172a">"banana": 1}</text>

    <rect x="552" y="76" width="150" height="90" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="627" y="96" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#14532d">"apple" &#8212; seen</text>
    <text x="627" y="120" text-anchor="middle" font-size="11" fill="#0f172a">{"apple": <tspan font-weight="700" fill="#16a34a">2</tspan>,</text>
    <text x="627" y="136" text-anchor="middle" font-size="11" fill="#0f172a">"banana": 1}</text>
    <text x="627" y="154" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">add one</text>
  </g>
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#c1)">
    <path d="M182 121 H200"/><path d="M356 121 H374"/><path d="M530 121 H548"/>
  </g>

  <rect x="30" y="184" width="672" height="82" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">
    <text x="46" y="206" fill="#0f172a">counts = {}</text>
    <text x="46" y="224" fill="#0f172a">for word in words:</text>
    <text x="46" y="242" fill="#0f172a">    if word in counts:  counts[word] += 1</text>
    <text x="46" y="260" fill="#0f172a">    else:               counts[word] = 1</text>
  </g>

  <defs><marker id="c1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs>
</svg>
