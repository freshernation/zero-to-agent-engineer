<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-label="A list of dicts has two levels: records and fields">
  <rect width="720" height="280" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Two levels: the list holds records, each record holds fields</text>

  <rect x="24" y="46" width="330" height="212" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="189" y="68" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" font-weight="700" fill="#5b21b6">students &#8212; a list</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">
    <rect x="44" y="82" width="290" height="72" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="56" y="100" fill="#7c3aed" font-weight="700">[0]</text>
    <text x="96" y="100" fill="#0f172a">{</text>
    <text x="110" y="118" fill="#16a34a">"name"</text><text x="180" y="118" fill="#0f172a">: "Ana",</text>
    <text x="110" y="136" fill="#16a34a">"score"</text><text x="180" y="136" fill="#0f172a">: 92 }</text>

    <rect x="44" y="166" width="290" height="72" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="56" y="184" fill="#7c3aed" font-weight="700">[1]</text>
    <text x="96" y="184" fill="#0f172a">{</text>
    <text x="110" y="202" fill="#16a34a">"name"</text><text x="180" y="202" fill="#0f172a">: "Ben",</text>
    <text x="110" y="220" fill="#16a34a">"score"</text><text x="180" y="220" fill="#0f172a">: 78 }</text>
  </g>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">
    <rect x="378" y="82" width="318" height="90" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="394" y="106" fill="#0f172a">for <tspan fill="#16a34a" font-weight="700">student</tspan> in students:</text>
    <text x="394" y="128" fill="#0f172a">    print(<tspan fill="#16a34a" font-weight="700">student</tspan>["name"])</text>
    <text x="394" y="156" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">Each round hands you one <tspan font-weight="700">dict</tspan>, not a value.</text>
  </g>

  <g stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#d1)">
    <path d="M340 118 H374"/><path d="M340 200 C 360 200, 360 140, 374 132"/>
  </g>

  <rect x="378" y="188" width="318" height="70" rx="6" fill="#fffbeb" stroke="#d97706"/>
  <text x="394" y="210" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#92400e">This is what a web API sends you.</text>
  <text x="394" y="230" font-family="system-ui,sans-serif" font-size="11" fill="#92400e">Every dataset in week 5 arrives in exactly</text>
  <text x="394" y="246" font-family="system-ui,sans-serif" font-size="11" fill="#92400e">this shape. Learn to read it now.</text>

  <defs><marker id="d1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker></defs>
</svg>
