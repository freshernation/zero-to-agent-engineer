<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-label="Put the sort field first in the tuple">
  <rect width="720" height="320" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Tuples sort by their first item &#8212; so put the sort field first</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">
    <text x="30" y="58" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#475569">two parallel lists</text>
    <text x="30" y="80" fill="#0f172a">players = ["Ana", "Ben", "Cara"]</text>
    <text x="30" y="100" fill="#0f172a">scores  = [615, 892, 733]</text>
  </g>

  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#f1)"><path d="M120 112 V140"/></g>
  <text x="136" y="134" font-family="ui-monospace,monospace" font-size="13" fill="#0f172a">zip + append <tspan fill="#dc2626" font-weight="700">(score, name)</tspan></text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">
    <rect x="30" y="152" width="300" height="106" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="180" y="174" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#475569">pairs &#8212; unsorted</text>
    <text x="48" y="198" fill="#0f172a">(<tspan fill="#dc2626" font-weight="700">615</tspan>, "Ana")</text>
    <text x="48" y="220" fill="#0f172a">(<tspan fill="#dc2626" font-weight="700">892</tspan>, "Ben")</text>
    <text x="48" y="242" fill="#0f172a">(<tspan fill="#dc2626" font-weight="700">733</tspan>, "Cara")</text>

    <rect x="390" y="152" width="300" height="106" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="540" y="174" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#14532d">sorted(pairs, reverse=True)</text>
    <text x="408" y="198" fill="#0f172a">(<tspan fill="#16a34a" font-weight="700">892</tspan>, "Ben")</text>
    <text x="408" y="220" fill="#0f172a">(<tspan fill="#16a34a" font-weight="700">733</tspan>, "Cara")</text>
    <text x="408" y="242" fill="#0f172a">(<tspan fill="#16a34a" font-weight="700">615</tspan>, "Ana")</text>
  </g>
  <g stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#f2)"><path d="M338 205 H384"/></g>

  <rect x="30" y="272" width="660" height="34" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="360" y="293" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#1e3a8a">Python compares item 0 first. Only if those tie does it look at item 1. So item 0 <tspan font-weight="700">is</tspan> the sort key.</text>

  <defs>
    <marker id="f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
    <marker id="f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker>
  </defs>
</svg>
