<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" role="img" aria-label="Tuples are frozen, lists can change">
  <rect width="720" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Same idea, one difference that changes everything</text>

  <rect x="24" y="46" width="330" height="186" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="189" y="70" text-anchor="middle" font-family="ui-monospace,monospace" font-size="15" font-weight="700" fill="#1e3a8a">list &#8212; square brackets</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">
    <text x="42" y="98"  fill="#0f172a">names = ["Ana", "Ben"]</text>
    <text x="42" y="122" fill="#16a34a">names[0] = "Zoe"   &#10003;</text>
    <text x="42" y="144" fill="#16a34a">names.append("Cara") &#10003;</text>
  </g>
  <text x="42" y="176" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#1e3a8a">Use when items get added and removed.</text>
  <text x="42" y="198" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">A shopping basket. A growing result.</text>
  <text x="42" y="218" font-family="system-ui,sans-serif" font-size="11" fill="#991b1b">Cannot be a dict key.</text>

  <rect x="374" y="46" width="322" height="186" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="535" y="70" text-anchor="middle" font-family="ui-monospace,monospace" font-size="15" font-weight="700" fill="#5b21b6">tuple &#8212; round brackets</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">
    <text x="392" y="98"  fill="#0f172a">point = (3, 7)</text>
    <text x="392" y="122" fill="#0f172a">point[0]           &#10003;</text>
    <text x="392" y="144" fill="#dc2626">point[0] = 5       &#10007; TypeError</text>
  </g>
  <text x="392" y="176" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#5b21b6">Use for a fixed group that belongs together.</text>
  <text x="392" y="198" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">A coordinate. An RGB colour. A (score, name) pair.</text>
  <text x="392" y="218" font-family="system-ui,sans-serif" font-size="11" fill="#14532d">Can be a dict key, because it cannot change.</text>
</svg>
