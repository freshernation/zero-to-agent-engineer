<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-label="A function that prints shows you the answer, one that returns gives it to you">
  <rect width="720" height="320" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">print <tspan font-style="italic">shows</tspan> you the answer. return <tspan font-style="italic">gives</tspan> it to you.</text>

  <rect x="24" y="46" width="330" height="230" rx="8" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">
    <text x="42" y="72" fill="#0f172a">def add_tax(amount):</text>
    <text x="42" y="92" fill="#dc2626" font-weight="700">    print(amount * 1.08)</text>
    <text x="42" y="122" fill="#0f172a">a = add_tax(100)</text>
  </g>
  <rect x="42" y="134" width="294" height="26" rx="4" fill="#0f172a"/>
  <text x="54" y="152" font-family="ui-monospace,monospace" font-size="12" fill="#4ade80">108.0</text>
  <text x="42" y="180" font-family="system-ui,sans-serif" font-size="12" fill="#991b1b">You saw it. But what is in <tspan font-family="ui-monospace,monospace" font-weight="700">a</tspan>?</text>
  <rect x="42" y="192" width="130" height="34" rx="5" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="107" y="214" text-anchor="middle" font-family="ui-monospace,monospace" font-size="15" font-weight="700" fill="#dc2626">None</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">
    <text x="42" y="248" fill="#0f172a">a + 10</text>
    <text x="42" y="266" fill="#dc2626">TypeError: unsupported operand type(s)</text>
  </g>

  <rect x="374" y="46" width="322" height="230" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">
    <text x="392" y="72" fill="#0f172a">def add_tax(amount):</text>
    <text x="392" y="92" fill="#16a34a" font-weight="700">    return amount * 1.08</text>
    <text x="392" y="122" fill="#0f172a">b = add_tax(100)</text>
  </g>
  <rect x="392" y="134" width="286" height="26" rx="4" fill="#0f172a"/>
  <text x="404" y="152" font-family="ui-monospace,monospace" font-size="12" fill="#64748b">(nothing printed)</text>
  <text x="392" y="180" font-family="system-ui,sans-serif" font-size="12" fill="#14532d">Nothing on screen. But <tspan font-family="ui-monospace,monospace" font-weight="700">b</tspan> holds it.</text>
  <rect x="392" y="192" width="130" height="34" rx="5" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="457" y="214" text-anchor="middle" font-family="ui-monospace,monospace" font-size="15" font-weight="700" fill="#16a34a">108.0</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">
    <text x="392" y="248" fill="#0f172a">b + 10</text>
    <text x="392" y="266" fill="#16a34a">118.0   &#8212; other code can use it</text>
  </g>

  <rect x="24" y="288" width="672" height="22" rx="5" fill="#fffbeb" stroke="#d97706"/>
  <text x="360" y="303" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#92400e">A function with no <tspan font-family="ui-monospace,monospace" font-weight="700">return</tspan> hands back <tspan font-family="ui-monospace,monospace" font-weight="700">None</tspan>. Python never warns you.</text>
</svg>
