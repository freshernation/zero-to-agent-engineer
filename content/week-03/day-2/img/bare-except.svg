<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" role="img" aria-label="A bare except swallows your own typos">
  <rect width="720" height="290" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">A bare <tspan font-family="ui-monospace,monospace">except:</tspan> catches your own mistakes too</text>

  <rect x="24" y="46" width="330" height="200" rx="8" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">
    <text x="42" y="72" fill="#0f172a">try:</text>
    <text x="42" y="92" fill="#0f172a">    return prices[item]</text>
    <text x="42" y="112" fill="#dc2626" font-weight="700">except:</text>
    <text x="42" y="132" fill="#0f172a">    return 0</text>
  </g>
  <text x="42" y="162" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#991b1b">This net catches:</text>
  <g font-family="system-ui,sans-serif" font-size="11" fill="#0f172a">
    <text x="42" y="182">&#8226; the missing key you meant to handle &#10003;</text>
    <text x="42" y="200" fill="#991b1b">&#8226; your misspelt variable name (NameError)</text>
    <text x="42" y="218" fill="#991b1b">&#8226; your typo in a function name</text>
    <text x="42" y="236" fill="#991b1b">&#8226; a bug three functions deeper</text>
  </g>

  <rect x="374" y="46" width="322" height="200" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">
    <text x="392" y="72" fill="#0f172a">try:</text>
    <text x="392" y="92" fill="#0f172a">    return prices[item]</text>
    <text x="392" y="112" fill="#16a34a" font-weight="700">except KeyError:</text>
    <text x="392" y="132" fill="#0f172a">    return 0</text>
  </g>
  <text x="392" y="162" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#14532d">This net catches:</text>
  <g font-family="system-ui,sans-serif" font-size="11" fill="#0f172a">
    <text x="392" y="182">&#8226; the missing key you meant to handle &#10003;</text>
    <text x="392" y="204" fill="#14532d">Everything else still crashes loudly</text>
    <text x="392" y="222" fill="#14532d">&#8212; which is exactly what you want,</text>
    <text x="392" y="240" fill="#14532d">because those are <tspan font-weight="700">your bugs</tspan>.</text>
  </g>

  <rect x="24" y="256" width="672" height="22" rx="5" fill="#fffbeb" stroke="#d97706"/>
  <text x="360" y="271" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#92400e">If you cannot name the exception, you do not yet know what you are recovering from.</text>
</svg>
