<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-label="How try, except, else and finally run">
  <rect width="720" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">&#8220;Try this. If it blows up in this specific way, do that instead.&#8221;</text>

  <rect x="250" y="46" width="220" height="44" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="360" y="74" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" fill="#1e3a8a">try: value = int(text)</text>

  <g stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#h1)"><path d="M300 92 V126"/></g>
  <g stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#h2)"><path d="M420 92 V126"/></g>
  <text x="256" y="112" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#14532d">worked</text>
  <text x="430" y="112" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#991b1b">raised ValueError</text>

  <rect x="150" y="132" width="230" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="265" y="154" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" fill="#14532d">else:</text>
  <text x="265" y="176" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#0f172a">runs only if nothing went wrong</text>

  <rect x="396" y="132" width="230" height="60" rx="8" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
  <text x="511" y="154" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" fill="#991b1b">except ValueError:</text>
  <text x="511" y="176" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#0f172a">recover, then carry on</text>

  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#h3)">
    <path d="M265 194 V222 H340"/><path d="M511 194 V222 H380"/>
  </g>

  <rect x="250" y="230" width="220" height="52" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="360" y="252" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" fill="#92400e">finally:</text>
  <text x="360" y="272" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#0f172a">runs either way, always</text>

  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#h3)"><path d="M360 284 V306"/></g>
  <text x="360" y="322" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#475569">the program keeps running</text>

  <defs>
    <marker id="h1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker>
    <marker id="h2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker>
    <marker id="h3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
  </defs>
</svg>
