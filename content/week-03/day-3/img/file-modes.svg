<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-label="The three file modes and what they do to existing content">
  <rect width="720" height="260" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">What each mode does to a file that already has &#8220;old&#8221; in it</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">
    <rect x="24" y="50" width="216" height="164" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="132" y="76" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">"r"</text>
    <text x="132" y="98" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#475569">read</text>
    <rect x="44" y="112" width="176" height="30" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="132" y="132" text-anchor="middle" fill="#0f172a">old</text>
    <text x="132" y="164" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#14532d">untouched</text>
    <text x="132" y="190" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#991b1b">FileNotFoundError</text>
    <text x="132" y="204" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#991b1b">if it is not there</text>

    <rect x="252" y="50" width="216" height="164" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <text x="360" y="76" text-anchor="middle" font-size="18" font-weight="700" fill="#991b1b">"w"</text>
    <text x="360" y="98" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#475569">write</text>
    <rect x="272" y="112" width="176" height="30" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="360" y="132" text-anchor="middle" fill="#dc2626">new</text>
    <text x="360" y="164" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#991b1b">&#8220;old&#8221; is gone</text>
    <text x="360" y="188" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#991b1b">Wiped the moment you</text>
    <text x="360" y="202" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#991b1b"><tspan font-weight="700">open</tspan>, not when you write</text>

    <rect x="480" y="50" width="216" height="164" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="588" y="76" text-anchor="middle" font-size="18" font-weight="700" fill="#14532d">"a"</text>
    <text x="588" y="98" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#475569">append</text>
    <rect x="500" y="112" width="176" height="30" rx="4" fill="#f0fdf4" stroke="#86efac"/>
    <text x="588" y="132" text-anchor="middle" fill="#0f172a">old<tspan fill="#16a34a">new</tspan></text>
    <text x="588" y="164" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#14532d">added to the end</text>
    <text x="588" y="190" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#475569">creates the file if it</text>
    <text x="588" y="204" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#475569">does not exist</text>
  </g>

  <rect x="24" y="226" width="672" height="24" rx="5" fill="#fff1f2" stroke="#dc2626"/>
  <text x="360" y="242" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#991b1b">Opening a file in <tspan font-family="ui-monospace,monospace" font-weight="700">"w"</tspan> just to &#8220;check something&#8221; has destroyed a lot of people&#8217;s data. Use <tspan font-family="ui-monospace,monospace" font-weight="700">"r"</tspan> to look.</text>
</svg>
