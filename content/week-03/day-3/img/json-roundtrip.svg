<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-label="JSON turns Python data into text and back again">
  <rect width="720" height="280" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">JSON is how data becomes text, and text becomes data again</text>

  <rect x="24" y="50" width="270" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="159" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">Python objects in memory</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">
    <text x="40" y="98"  fill="#0f172a">[</text>
    <text x="54" y="118" fill="#0f172a">{"item": "Coffee",</text>
    <text x="54" y="136" fill="#0f172a"> "amount": 4.5}</text>
    <text x="40" y="154" fill="#0f172a">]</text>
  </g>

  <rect x="426" y="50" width="270" height="120" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="561" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#14532d">data.json &#8212; plain text on disk</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">
    <text x="442" y="98"  fill="#0f172a">[</text>
    <text x="456" y="116" fill="#0f172a">  {</text>
    <text x="456" y="132" fill="#0f172a">    "item": "Coffee",</text>
    <text x="456" y="148" fill="#0f172a">    "amount": 4.5</text>
    <text x="456" y="164" fill="#0f172a">  }</text>
  </g>

  <g stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#j1)"><path d="M300 88 H420"/></g>
  <text x="360" y="82" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#1e3a8a">json.dump</text>
  <g stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#j2)"><path d="M420 140 H300"/></g>
  <text x="360" y="134" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#14532d">json.load</text>

  <rect x="24" y="186" width="672" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="40" y="208" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#0f172a">What survives the round trip</text>
  <g font-family="system-ui,sans-serif" font-size="11">
    <text x="40" y="230" fill="#14532d">&#10003; list &#183; dict &#183; str &#183; int &#183; float &#183; True/False &#183; None</text>
    <text x="40" y="250" fill="#991b1b">&#10007; tuple comes back as a <tspan font-weight="700">list</tspan> &#183; set, function, class instance: not allowed at all</text>
    <text x="400" y="230" fill="#64748b">JSON writes <tspan font-family="ui-monospace,monospace">true</tspan>/<tspan font-family="ui-monospace,monospace">false</tspan>/<tspan font-family="ui-monospace,monospace">null</tspan>, lowercase.</text>
    <text x="400" y="250" fill="#64748b">Python reads them back capitalised. That is normal.</text>
  </g>

  <defs>
    <marker id="j1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
    <marker id="j2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker>
  </defs>
</svg>
