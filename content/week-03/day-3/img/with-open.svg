<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="720" height="270" role="img" aria-label="The with block opens and closes the file for you">
  <rect width="720" height="270" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a"><tspan font-family="ui-monospace,monospace">with</tspan> closes the file for you &#8212; even when something goes wrong inside</text>

  <rect x="40" y="48" width="640" height="120" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">
    <text x="60" y="78"  fill="#0f172a">with open("notes.txt", "w") as f:</text>
    <text x="94" y="104" fill="#0f172a">f.write("hello\n")</text>
    <text x="94" y="126" fill="#0f172a">something_that_crashes()</text>
  </g>
  <rect x="76" y="88" width="14" height="48" fill="#dbeafe"/>
  <text x="380" y="104" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">&#8592; the file is open only in here</text>
  <text x="60" y="156" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#16a34a">&#8595; block ends (normally or by crashing) &#8594; file is flushed and closed. Always.</text>

  <rect x="40" y="184" width="310" height="66" rx="8" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
  <text x="56" y="206" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#991b1b">Without <tspan font-family="ui-monospace,monospace">with</tspan></text>
  <text x="56" y="226" font-family="system-ui,sans-serif" font-size="11" fill="#0f172a">A crash leaves the file open and half-written.</text>
  <text x="56" y="242" font-family="system-ui,sans-serif" font-size="11" fill="#0f172a">Data loss on the machine that crashed.</text>

  <rect x="370" y="184" width="310" height="66" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="386" y="206" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#14532d">With <tspan font-family="ui-monospace,monospace">with</tspan></text>
  <text x="386" y="226" font-family="system-ui,sans-serif" font-size="11" fill="#0f172a">Nothing to remember. Nothing to forget.</text>
  <text x="386" y="242" font-family="system-ui,sans-serif" font-size="11" fill="#0f172a">Use it every single time you open a file.</text>
</svg>
