<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="A comprehension is the same loop with the parts reordered">
  <rect width="720" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Same loop. The only change is which part comes first.</text>

  <rect x="24" y="46" width="316" height="126" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="182" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#475569">the loop you have written forty times</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">
    <text x="42" y="96"  fill="#0f172a">big = []</text>
    <text x="42" y="118" fill="#2563eb">for n in numbers:</text>
    <text x="42" y="140" fill="#7c3aed">    if n &gt; 100:</text>
    <text x="42" y="162" fill="#16a34a">        big.append(n)</text>
  </g>

  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#k1)"><path d="M348 110 H392"/></g>

  <rect x="404" y="46" width="292" height="126" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="550" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#14532d">the same thing, one line</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">
    <text x="420" y="102" fill="#0f172a">big = [<tspan fill="#16a34a" font-weight="700">n</tspan> <tspan fill="#2563eb">for n in numbers</tspan></text>
    <text x="420" y="124" fill="#0f172a">       <tspan fill="#7c3aed">if n &gt; 100</tspan>]</text>
  </g>
  <text x="420" y="154" font-family="system-ui,sans-serif" font-size="11" fill="#14532d">Read it out loud: &#8220;n, for every n in numbers, if n is over 100.&#8221;</text>

  <rect x="24" y="190" width="672" height="94" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="40" y="212" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">The three slots, always in this order</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">
    <text x="40" y="244" fill="#0f172a">[ <tspan fill="#16a34a" font-weight="700">what you want</tspan>  <tspan fill="#2563eb" font-weight="700">for x in source</tspan>  <tspan fill="#7c3aed" font-weight="700">if condition</tspan> ]</text>
  </g>
  <g font-family="system-ui,sans-serif" font-size="11">
    <text x="52"  y="268" fill="#14532d">the value to collect</text>
    <text x="250" y="268" fill="#1e3a8a">where each one comes from</text>
    <text x="500" y="268" fill="#5b21b6">optional filter</text>
  </g>

  <defs><marker id="k1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs>
</svg>
