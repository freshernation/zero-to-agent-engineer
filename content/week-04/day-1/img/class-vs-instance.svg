<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" role="img" aria-label="A class is the blueprint, an instance is a thing built from it">
  <rect width="720" height="290" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">One blueprint. Many things built from it.</text>

  <rect x="24" y="46" width="270" height="196" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="159" y="70" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#5b21b6">the class &#8212; a blueprint</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">
    <text x="40" y="96"  fill="#0f172a">class Expense:</text>
    <text x="40" y="114" fill="#0f172a">    def __init__(self, d, a):</text>
    <text x="40" y="132" fill="#0f172a">        self.description = d</text>
    <text x="40" y="150" fill="#0f172a">        self.amount = a</text>
    <text x="40" y="176" fill="#0f172a">    def label(self):</text>
    <text x="40" y="194" fill="#0f172a">        return f"..."</text>
  </g>
  <text x="40" y="224" font-family="system-ui,sans-serif" font-size="11" fill="#5b21b6">Holds no data of its own. Nothing has run yet.</text>

  <g stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#n1)">
    <path d="M302 110 H352"/><path d="M302 186 H352"/>
  </g>
  <text x="327" y="102" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#5b21b6">Expense(...)</text>

  <rect x="362" y="60" width="334" height="82" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="529" y="82" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#14532d">an instance</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">
    <text x="378" y="104" fill="#0f172a">coffee = Expense("Coffee", 4.5)</text>
    <text x="378" y="126" fill="#0f172a">coffee.amount  &#8594;  4.5</text>
  </g>

  <rect x="362" y="152" width="334" height="82" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="529" y="174" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#14532d">another instance, its own data</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">
    <text x="378" y="196" fill="#0f172a">rent = Expense("Rent", 900)</text>
    <text x="378" y="218" fill="#0f172a">rent.amount  &#8594;  900</text>
  </g>

  <text x="360" y="266" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#475569">Each instance carries its own attributes. They share only the methods.</text>

  <defs><marker id="n1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker></defs>
</svg>
