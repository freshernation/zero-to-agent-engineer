<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-label="A dict cannot enforce its own rules, a class can">
  <rect width="720" height="260" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">The problem a class solves: data and its rules drifting apart</text>

  <rect x="24" y="46" width="330" height="192" rx="8" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
  <text x="189" y="70" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#991b1b">a dict &#8212; the rules live somewhere else</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">
    <text x="42" y="96"  fill="#0f172a">acct = {"balance": 100}</text>
    <text x="42" y="120" fill="#dc2626">acct["balance"] = -5000</text>
    <text x="42" y="142" fill="#dc2626">acct["blance"] = 50</text>
    <text x="42" y="164" fill="#dc2626">del acct["balance"]</text>
  </g>
  <text x="42" y="192" font-family="system-ui,sans-serif" font-size="11" fill="#991b1b">Every one of those is allowed. None raises anything.</text>
  <text x="42" y="212" font-family="system-ui,sans-serif" font-size="11" fill="#991b1b">The typo silently creates a new key.</text>

  <rect x="374" y="46" width="322" height="192" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="535" y="70" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#14532d">a class &#8212; the rules live with the data</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">
    <text x="392" y="96"  fill="#0f172a">def withdraw(self, amount):</text>
    <text x="392" y="116" fill="#0f172a">    if amount &gt; self.balance:</text>
    <text x="392" y="136" fill="#16a34a">        raise ValueError(</text>
    <text x="392" y="154" fill="#16a34a">            "Insufficient funds")</text>
    <text x="392" y="174" fill="#0f172a">    self.balance -= amount</text>
  </g>
  <text x="392" y="202" font-family="system-ui,sans-serif" font-size="11" fill="#14532d">The object refuses. Nobody can get it into a bad state</text>
  <text x="392" y="218" font-family="system-ui,sans-serif" font-size="11" fill="#14532d">by accident, from anywhere in the program.</text>
</svg>
