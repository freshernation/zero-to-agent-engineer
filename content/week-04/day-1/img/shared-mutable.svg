<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-label="A class attribute is shared by every instance">
  <rect width="720" height="280" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Where you write the list decides who owns it</text>

  <rect x="24" y="46" width="330" height="212" rx="8" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
  <text x="189" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#991b1b">on the class &#8212; ONE list, shared</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">
    <text x="42" y="94"  fill="#0f172a">class Ledger:</text>
    <text x="42" y="112" fill="#dc2626">    expenses = []</text>
    <text x="42" y="136" fill="#0f172a">a = Ledger(); b = Ledger()</text>
    <text x="42" y="154" fill="#0f172a">a.expenses.append("Tea")</text>
    <text x="42" y="176" fill="#dc2626">b.expenses  &#8594;  ["Tea"]</text>
  </g>
  <rect x="90" y="192" width="200" height="34" rx="5" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="190" y="214" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" fill="#dc2626">["Tea"]</text>
  <text x="42" y="246" font-family="system-ui,sans-serif" font-size="11" fill="#991b1b">Both a and b point at the same list. No error, ever.</text>

  <rect x="374" y="46" width="322" height="212" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="535" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#14532d">in __init__ &#8212; one list each</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">
    <text x="392" y="94"  fill="#0f172a">class Ledger:</text>
    <text x="392" y="112" fill="#0f172a">    def __init__(self):</text>
    <text x="392" y="130" fill="#16a34a">        self.expenses = []</text>
    <text x="392" y="154" fill="#0f172a">a.expenses.append("Tea")</text>
    <text x="392" y="176" fill="#16a34a">b.expenses  &#8594;  []</text>
  </g>
  <rect x="400" y="192" width="130" height="34" rx="5" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="465" y="214" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" fill="#16a34a">["Tea"]</text>
  <rect x="546" y="192" width="130" height="34" rx="5" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="611" y="214" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" fill="#16a34a">[]</text>
  <text x="392" y="246" font-family="system-ui,sans-serif" font-size="11" fill="#14532d">A new list is created on every single call to __init__.</text>
</svg>
