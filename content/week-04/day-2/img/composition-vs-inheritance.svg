<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-label="has-a versus is-a">
  <rect width="720" height="260" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Ask the sentence out loud: &#8220;has a&#8221; or &#8220;is a&#8221;?</text>

  <rect x="24" y="46" width="330" height="192" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="189" y="70" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#14532d">HAS A &#8594; composition</text>
  <g font-family="ui-monospace,monospace" font-size="12">
    <rect x="60" y="86" width="120" height="34" rx="5" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <text x="120" y="108" text-anchor="middle" fill="#0f172a">Ledger</text>
    <rect x="200" y="86" width="120" height="34" rx="5" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <text x="260" y="108" text-anchor="middle" fill="#0f172a">Expense</text>
  </g>
  <g stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#q1)"><path d="M182 103 H196"/></g>
  <text x="60" y="142" font-family="ui-monospace,monospace" font-size="12" fill="#14532d">self.expenses = []</text>
  <text x="60" y="170" font-family="system-ui,sans-serif" font-size="11" fill="#0f172a">&#8220;A Ledger has Expenses.&#8221; &#10003;</text>
  <text x="60" y="192" font-family="system-ui,sans-serif" font-size="11" fill="#475569">A Car has an Engine. An Order has Items.</text>
  <text x="60" y="212" font-family="system-ui,sans-serif" font-size="11" fill="#475569">A Report has Records.</text>

  <rect x="374" y="46" width="322" height="192" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="535" y="70" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">IS A &#8594; inheritance</text>
  <g font-family="ui-monospace,monospace" font-size="12">
    <rect x="475" y="86" width="120" height="30" rx="5" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="535" y="106" text-anchor="middle" fill="#0f172a">Shape</text>
    <rect x="475" y="140" width="120" height="30" rx="5" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="535" y="160" text-anchor="middle" fill="#0f172a">Circle</text>
  </g>
  <g stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#q2)"><path d="M535 138 V120"/></g>
  <text x="392" y="192" font-family="system-ui,sans-serif" font-size="11" fill="#0f172a">&#8220;A Circle is a Shape.&#8221; &#10003;</text>
  <text x="392" y="212" font-family="system-ui,sans-serif" font-size="11" fill="#991b1b">Rarer than people think. Reach for it last.</text>

  <defs>
    <marker id="q1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker>
    <marker id="q2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
  </defs>
</svg>
