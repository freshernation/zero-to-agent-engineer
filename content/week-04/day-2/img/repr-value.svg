<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" role="img" aria-label="Without repr your debugging output is memory addresses">
  <rect width="720" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">One line on the class changes every debugging session you ever have</text>

  <rect x="24" y="46" width="330" height="180" rx="8" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
  <text x="189" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#991b1b">no __repr__</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">
    <text x="42" y="94" fill="#0f172a">print(points)</text>
  </g>
  <rect x="42" y="104" width="294" height="80" rx="5" fill="#0f172a"/>
  <text x="54" y="124" font-family="ui-monospace,monospace" font-size="10" fill="#f87171">[&lt;__main__.Point object at</text>
  <text x="54" y="140" font-family="ui-monospace,monospace" font-size="10" fill="#f87171">0x104a2b1d0&gt;, &lt;__main__.Point</text>
  <text x="54" y="156" font-family="ui-monospace,monospace" font-size="10" fill="#f87171">object at 0x104a2b210&gt;]</text>
  <text x="42" y="206" font-family="system-ui,sans-serif" font-size="11" fill="#991b1b">Useless. And the addresses change every run.</text>

  <rect x="374" y="46" width="322" height="180" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="535" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#14532d">with __repr__</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">
    <text x="392" y="90" fill="#0f172a">def __repr__(self):</text>
    <text x="392" y="106" fill="#0f172a">    return f"Point({self.x}, {self.y})"</text>
  </g>
  <rect x="392" y="118" width="286" height="46" rx="5" fill="#0f172a"/>
  <text x="404" y="146" font-family="ui-monospace,monospace" font-size="12" fill="#4ade80">[Point(1, 2), Point(3, 4)]</text>
  <text x="392" y="188" font-family="system-ui,sans-serif" font-size="11" fill="#14532d">You can read it. You can paste it back into a</text>
  <text x="392" y="204" font-family="system-ui,sans-serif" font-size="11" fill="#14532d">prompt and recreate the exact bug.</text>
</svg>
