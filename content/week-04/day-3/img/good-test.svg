<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" role="img" aria-label="A test that cannot tell two bugs apart is not pinning anything down">
  <rect width="720" height="290" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">The trap: at radius 2, area and circumference are the same number</text>

  <rect x="30" y="46" width="320" height="130" rx="8" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
  <text x="190" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#991b1b">one value tested</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">
    <text x="46" y="92"  fill="#0f172a">Circle(2).area()          = 12.57</text>
    <text x="46" y="112" fill="#0f172a">Circle(2).circumference() = 12.57</text>
  </g>
  <text x="46" y="140" font-family="system-ui,sans-serif" font-size="11" fill="#991b1b">Swap the two formulas and this suite stays green.</text>
  <text x="46" y="160" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#991b1b">The bug ships.</text>

  <rect x="370" y="46" width="320" height="130" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="530" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#14532d">two values tested</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">
    <text x="386" y="92"  fill="#0f172a">Circle(3).area()          = 28.27</text>
    <text x="386" y="112" fill="#0f172a">Circle(3).circumference() = 18.85</text>
  </g>
  <text x="386" y="140" font-family="system-ui,sans-serif" font-size="11" fill="#14532d">Now they differ. A swap fails immediately.</text>
  <text x="386" y="160" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#14532d">The test pins the behaviour down.</text>

  <rect x="30" y="192" width="660" height="80" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="46" y="214" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">The only question that matters about a test</text>
  <text x="46" y="240" font-family="system-ui,sans-serif" font-size="14" fill="#0f172a">&#8220;Would this fail if the code were wrong?&#8221;</text>
  <text x="46" y="262" font-family="system-ui,sans-serif" font-size="11" fill="#475569">If two different bugs would both pass it, it is not pinning anything down.</text>
</svg>
