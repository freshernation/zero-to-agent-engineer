<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" role="img" aria-label="Optional forces you to notice a function can return nothing">
  <rect width="720" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a"><tspan font-family="ui-monospace,monospace">| None</tspan> makes the case people forget impossible to ignore</text>

  <rect x="30" y="46" width="322" height="164" rx="8" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">
    <text x="46" y="72"  fill="#0f172a">def find(names, target)<tspan fill="#dc2626"> -&gt; str</tspan>:</text>
    <text x="46" y="90"  fill="#0f172a">    for n in names:</text>
    <text x="46" y="108" fill="#0f172a">        if n == target: return n</text>
    <text x="46" y="126" fill="#dc2626">    # falls off the end &#8594; None</text>
  </g>
  <text x="46" y="156" font-family="system-ui,sans-serif" font-size="11" fill="#991b1b">The hint says <tspan font-family="ui-monospace,monospace">str</tspan>. The truth is <tspan font-family="ui-monospace,monospace">str or None</tspan>.</text>
  <g font-family="ui-monospace,monospace" font-size="12">
    <text x="46" y="180" fill="#0f172a">find(names, "Zoe").upper()</text>
    <text x="46" y="198" fill="#dc2626" font-size="11">AttributeError: 'NoneType' has no 'upper'</text>
  </g>

  <rect x="368" y="46" width="322" height="164" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">
    <text x="384" y="72"  fill="#0f172a">def find(names, target)</text>
    <text x="384" y="90"  fill="#16a34a">        -&gt; str | None:</text>
  </g>
  <text x="384" y="122" font-family="system-ui,sans-serif" font-size="11" fill="#14532d">Now the signature tells the truth, and every</text>
  <text x="384" y="138" font-family="system-ui,sans-serif" font-size="11" fill="#14532d">caller can see they must handle the None.</text>
  <g font-family="ui-monospace,monospace" font-size="12">
    <text x="384" y="166" fill="#0f172a">result = find(names, "Zoe")</text>
    <text x="384" y="184" fill="#0f172a">if result is not None:</text>
    <text x="384" y="200" fill="#0f172a">    print(result.upper())</text>
  </g>

  <text x="360" y="234" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#475569">Writing the hint forces you to notice. That is most of its value.</text>
</svg>
