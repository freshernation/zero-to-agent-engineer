<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-label="The five sections of a README that matter">
  <rect width="720" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Written for someone who has never seen it and has four minutes</text>

  <g font-family="system-ui,sans-serif" font-size="12">
    <rect x="30" y="46" width="660" height="46" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <circle cx="54" cy="69" r="14" fill="#2563eb"/><text x="54" y="74" text-anchor="middle" fill="#fff" font-weight="700" font-size="13">1</text>
    <text x="80" y="66" font-size="13" font-weight="700" fill="#0f172a">What it is</text>
    <text x="80" y="83" fill="#64748b">One sentence. No throat-clearing, no &#8220;this project was created as part of&#8230;&#8221;</text>

    <rect x="30" y="100" width="660" height="46" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <circle cx="54" cy="123" r="14" fill="#2563eb"/><text x="54" y="128" text-anchor="middle" fill="#fff" font-weight="700" font-size="13">2</text>
    <text x="80" y="120" font-size="13" font-weight="700" fill="#0f172a">What it does</text>
    <text x="80" y="137" fill="#64748b">Three or four bullets. Features the user sees, not how you built them.</text>

    <rect x="30" y="154" width="660" height="46" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <circle cx="54" cy="177" r="14" fill="#16a34a"/><text x="54" y="182" text-anchor="middle" fill="#fff" font-weight="700" font-size="13">3</text>
    <text x="80" y="174" font-size="13" font-weight="700" fill="#0f172a">How to run it</text>
    <text x="80" y="191" fill="#64748b">Commands they can paste. Test them from a clean clone &#8212; they must actually work.</text>

    <rect x="30" y="208" width="660" height="46" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <circle cx="54" cy="231" r="14" fill="#16a34a"/><text x="54" y="236" text-anchor="middle" fill="#fff" font-weight="700" font-size="13">4</text>
    <text x="80" y="228" font-size="13" font-weight="700" fill="#0f172a">How to run the tests</text>
    <text x="80" y="245" fill="#64748b">The line that says this is real work rather than a homework dump.</text>

    <rect x="30" y="262" width="660" height="46" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <circle cx="54" cy="285" r="14" fill="#d97706"/><text x="54" y="290" text-anchor="middle" fill="#fff" font-weight="700" font-size="13">5</text>
    <text x="80" y="282" font-size="13" font-weight="700" fill="#0f172a">What you would do next</text>
    <text x="80" y="299" fill="#92400e">Honest and brief. This is the section interviewers actually notice.</text>
  </g>
</svg>
