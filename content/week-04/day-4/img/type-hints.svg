<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="720" height="270" role="img" aria-label="Reading a type-hinted signature">
  <rect width="720" height="270" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">A signature that documents itself</text>

  <text x="60" y="80" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" fill="#0f172a">def split_bill(total<tspan fill="#2563eb" font-weight="700">: float</tspan>, people<tspan fill="#2563eb" font-weight="700">: int</tspan>)<tspan fill="#16a34a" font-weight="700"> -&gt; float</tspan>:</text>

  <g stroke="#94a3b8" stroke-width="1.5" fill="none">
    <path d="M250 92 V120"/><path d="M400 92 V146"/><path d="M540 92 V172"/>
  </g>
  <g font-family="system-ui,sans-serif" font-size="12">
    <text x="250" y="136" fill="#1e3a8a">what goes in: a decimal number</text>
    <text x="400" y="162" fill="#1e3a8a">and a whole number</text>
    <text x="490" y="188" fill="#14532d">what comes back out</text>
  </g>

  <rect x="30" y="200" width="322" height="56" rx="8" fill="#fff1f2" stroke="#dc2626"/>
  <text x="46" y="222" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#991b1b">Python does NOT check these at runtime</text>
  <text x="46" y="242" font-family="system-ui,sans-serif" font-size="11" fill="#0f172a">Passing a string still works exactly as badly as before.</text>

  <rect x="368" y="200" width="322" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="384" y="222" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#14532d">So why write them?</text>
  <text x="384" y="242" font-family="system-ui,sans-serif" font-size="11" fill="#0f172a">Your editor warns you. A checker catches it before merge.</text>
</svg>
