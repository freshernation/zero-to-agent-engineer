<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220" role="img" aria-label="A request with no timeout waits forever">
  <rect width="720" height="220" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">The one everybody forgets</text>

  <rect x="30" y="46" width="322" height="146" rx="8" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
  <text x="46" y="70" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#0f172a">requests.get(url)</text>
  <text x="46" y="96" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#991b1b">Waits forever. Genuinely forever.</text>
  <rect x="46" y="110" width="290" height="30" rx="4" fill="#0f172a"/>
  <text x="60" y="130" font-family="ui-monospace,monospace" font-size="11" fill="#94a3b8">(no output, no error, no logs)</text>
  <text x="46" y="162" font-family="system-ui,sans-serif" font-size="11" fill="#991b1b">This is how a program hangs at 3am with</text>
  <text x="46" y="178" font-family="system-ui,sans-serif" font-size="11" fill="#991b1b">nothing to show for it.</text>

  <rect x="368" y="46" width="322" height="146" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="384" y="70" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#0f172a">requests.get(url, <tspan fill="#16a34a" font-weight="700">timeout=5</tspan>)</text>
  <text x="384" y="96" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#14532d">Gives up after 5 seconds.</text>
  <rect x="384" y="110" width="290" height="30" rx="4" fill="#0f172a"/>
  <text x="398" y="130" font-family="ui-monospace,monospace" font-size="11" fill="#f87171">requests.exceptions.Timeout</text>
  <text x="384" y="162" font-family="system-ui,sans-serif" font-size="11" fill="#14532d">An exception you can catch, log, and retry.</text>
  <text x="384" y="178" font-family="system-ui,sans-serif" font-size="11" fill="#14532d">A failure you can see beats one you cannot.</text>
</svg>
