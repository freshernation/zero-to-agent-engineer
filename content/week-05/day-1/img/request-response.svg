<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="The shape of an HTTP request and response">
  <rect width="720" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">One request out, one response back. That is all HTTP is.</text>

  <rect x="30" y="52" width="150" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="105" y="82" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">your program</text>
  <text x="105" y="102" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#475569">requests.get(...)</text>

  <rect x="540" y="52" width="150" height="70" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="615" y="82" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#14532d">the server</text>
  <text x="615" y="102" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#475569">127.0.0.1:8765</text>

  <g stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#s1)"><path d="M186 76 H534"/></g>
  <text x="360" y="70" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#1e3a8a">REQUEST</text>
  <g stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#s2)"><path d="M534 104 H186"/></g>
  <text x="360" y="120" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#14532d">RESPONSE</text>

  <rect x="30" y="142" width="322" height="140" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="46" y="164" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">What you send</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">
    <text x="46" y="188" fill="#0f172a">GET /products?category=tools</text>
    <text x="46" y="208" fill="#0f172a">Authorization: Bearer key</text>
  </g>
  <g font-family="system-ui,sans-serif" font-size="11" fill="#64748b">
    <text x="46" y="232">the path &#183; <tspan font-family="ui-monospace,monospace">params=</tspan> builds the query string</text>
    <text x="46" y="250">the headers &#183; <tspan font-family="ui-monospace,monospace">headers=</tspan> builds these</text>
    <text x="46" y="270" fill="#991b1b">and always <tspan font-family="ui-monospace,monospace" font-weight="700">timeout=5</tspan></text>
  </g>

  <rect x="368" y="142" width="322" height="140" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="384" y="164" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#14532d">What comes back</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">
    <text x="384" y="188" fill="#0f172a">response.status_code  &#8594; 200</text>
    <text x="384" y="208" fill="#0f172a">response.headers      &#8594; dict</text>
    <text x="384" y="228" fill="#0f172a">response.text         &#8594; str</text>
    <text x="384" y="248" fill="#0f172a">response.json()       &#8594; list[dict]</text>
  </g>
  <text x="384" y="270" font-family="system-ui,sans-serif" font-size="11" fill="#14532d">That last one is week 2&#8217;s list of dicts, arriving from a thousand miles away.</text>

  <defs>
    <marker id="s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
    <marker id="s2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker>
  </defs>
</svg>
