<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="The requests exception family and which failures raise">
  <rect width="720" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Which failures raise, and which just come back as a response</text>

  <rect x="30" y="46" width="322" height="124" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="191" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#92400e">the server answered &#8212; NO exception</text>
  <g font-family="ui-monospace,monospace" font-size="12" fill="#0f172a">
    <text x="46" y="94">200  &#8594;  response.json() is your data</text>
    <text x="46" y="116">404  &#8594;  response.json() is an error body</text>
    <text x="46" y="138">503  &#8594;  response.json() is an error body</text>
  </g>
  <text x="46" y="160" font-family="system-ui,sans-serif" font-size="11" fill="#92400e">Check <tspan font-family="ui-monospace,monospace">.status_code</tspan>, or call <tspan font-family="ui-monospace,monospace">raise_for_status()</tspan>.</text>

  <rect x="368" y="46" width="322" height="124" rx="8" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
  <text x="529" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#991b1b">no answer at all &#8212; these DO raise</text>
  <g font-family="ui-monospace,monospace" font-size="12" fill="#0f172a">
    <text x="384" y="94">Timeout          took too long</text>
    <text x="384" y="116">ConnectionError  no route / DNS</text>
    <text x="384" y="138">HTTPError        from raise_for_status</text>
  </g>
  <text x="384" y="160" font-family="system-ui,sans-serif" font-size="11" fill="#991b1b">There is no response object to inspect.</text>

  <text x="360" y="196" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#0f172a">They all inherit from one parent</text>

  <rect x="250" y="208" width="220" height="34" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="360" y="230" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" font-weight="700" fill="#1e3a8a">RequestException</text>

  <g stroke="#94a3b8" stroke-width="1.5" fill="none">
    <path d="M300 242 V262 H150 V272"/><path d="M360 242 V272"/><path d="M420 242 V262 H570 V272"/>
  </g>
  <g font-family="ui-monospace,monospace" font-size="11" fill="#475569" text-anchor="middle">
    <text x="150" y="286">Timeout</text><text x="360" y="286">ConnectionError</text><text x="570" y="286">HTTPError</text>
  </g>
</svg>
