<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-label="Status codes grouped by who is to blame">
  <rect width="720" height="260" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">The first digit tells you who to blame</text>

  <rect x="24" y="46" width="216" height="196" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="132" y="72" text-anchor="middle" font-family="ui-monospace,monospace" font-size="22" font-weight="700" fill="#14532d">2xx</text>
  <text x="132" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#14532d">it worked</text>
  <g font-family="ui-monospace,monospace" font-size="12" fill="#0f172a">
    <text x="44" y="124">200  OK</text>
    <text x="44" y="146">201  Created</text>
  </g>
  <text x="44" y="182" font-family="system-ui,sans-serif" font-size="11" fill="#475569">Carry on.</text>

  <rect x="252" y="46" width="216" height="196" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="360" y="72" text-anchor="middle" font-family="ui-monospace,monospace" font-size="22" font-weight="700" fill="#92400e">4xx</text>
  <text x="360" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#92400e">your fault</text>
  <g font-family="ui-monospace,monospace" font-size="12" fill="#0f172a">
    <text x="272" y="124">400  Bad request</text>
    <text x="272" y="144">401  No credentials</text>
    <text x="272" y="164">403  Not allowed</text>
    <text x="272" y="184">404  Not found</text>
    <text x="272" y="204">429  Slow down</text>
  </g>
  <text x="272" y="228" font-family="system-ui,sans-serif" font-size="11" fill="#92400e">Retrying will not help. Fix the request.</text>

  <rect x="480" y="46" width="216" height="196" rx="8" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
  <text x="588" y="72" text-anchor="middle" font-family="ui-monospace,monospace" font-size="22" font-weight="700" fill="#991b1b">5xx</text>
  <text x="588" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#991b1b">their fault</text>
  <g font-family="ui-monospace,monospace" font-size="12" fill="#0f172a">
    <text x="500" y="124">500  Server error</text>
    <text x="500" y="144">503  Unavailable</text>
  </g>
  <text x="500" y="182" font-family="system-ui,sans-serif" font-size="11" fill="#991b1b">Retrying <tspan font-weight="700">might</tspan> help. This is</text>
  <text x="500" y="198" font-family="system-ui,sans-serif" font-size="11" fill="#991b1b">the only family worth a retry.</text>
  <text x="500" y="222" font-family="system-ui,sans-serif" font-size="11" fill="#475569">(Wednesday&#8217;s topic.)</text>
</svg>
