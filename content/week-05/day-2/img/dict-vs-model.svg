<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="A dict has no shape, a model does">
  <rect width="720" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Where the failure happens decides how long it takes to find</text>

  <rect x="30" y="46" width="322" height="222" rx="8" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
  <text x="191" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#991b1b">raw dicts &#8212; no shape</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">
    <text x="46" y="92"  fill="#0f172a">users = response.json()</text>
    <text x="46" y="110" fill="#64748b"># one has "email": null</text>
    <text x="46" y="136" fill="#0f172a">for user in users:</text>
    <text x="46" y="154" fill="#0f172a">    send(user["email"].upper())</text>
  </g>
  <rect x="46" y="168" width="290" height="42" rx="4" fill="#0f172a"/>
  <text x="58" y="186" font-family="ui-monospace,monospace" font-size="10" fill="#f87171">AttributeError: 'NoneType' object</text>
  <text x="58" y="200" font-family="ui-monospace,monospace" font-size="10" fill="#f87171">has no attribute 'upper'</text>
  <text x="46" y="230" font-family="system-ui,sans-serif" font-size="11" fill="#991b1b">Mid-loop. Three functions from where the</text>
  <text x="46" y="246" font-family="system-ui,sans-serif" font-size="11" fill="#991b1b">bad data arrived. Half the emails already sent.</text>

  <rect x="368" y="46" width="322" height="222" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="529" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#14532d">a model &#8212; shape enforced at the door</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">
    <text x="384" y="92"  fill="#0f172a">class User(BaseModel):</text>
    <text x="384" y="110" fill="#0f172a">    email: str</text>
    <text x="384" y="136" fill="#16a34a">users = [User.model_validate(u)</text>
    <text x="384" y="152" fill="#16a34a">         for u in response.json()]</text>
  </g>
  <rect x="384" y="166" width="290" height="44" rx="4" fill="#0f172a"/>
  <text x="396" y="184" font-family="ui-monospace,monospace" font-size="10" fill="#fbbf24">ValidationError: users.2.email</text>
  <text x="396" y="198" font-family="ui-monospace,monospace" font-size="10" fill="#fbbf24">Input should be a valid string</text>
  <text x="384" y="230" font-family="system-ui,sans-serif" font-size="11" fill="#14532d">At the boundary. Names the record, the field</text>
  <text x="384" y="246" font-family="system-ui,sans-serif" font-size="11" fill="#14532d">and the rule. Nothing has been sent.</text>

  <rect x="30" y="278" width="660" height="0" fill="none"/>
</svg>
