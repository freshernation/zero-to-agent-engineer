<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="Exponential backoff doubles the wait between attempts">
  <rect width="720" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Back off exponentially &#8212; give the struggling service room to recover</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">
    <rect x="40" y="56" width="70" height="30" rx="5" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
    <text x="75" y="76" text-anchor="middle" fill="#991b1b">try 1</text>
    <text x="75" y="102" text-anchor="middle" font-size="10" fill="#991b1b">503</text>

    <rect x="150" y="56" width="70" height="30" rx="5" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
    <text x="185" y="76" text-anchor="middle" fill="#991b1b">try 2</text>
    <text x="185" y="102" text-anchor="middle" font-size="10" fill="#991b1b">503</text>

    <rect x="310" y="56" width="70" height="30" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="345" y="76" text-anchor="middle" fill="#14532d">try 3</text>
    <text x="345" y="102" text-anchor="middle" font-size="10" fill="#14532d">200 &#10003;</text>
  </g>

  <g stroke="#d97706" stroke-width="2" fill="none">
    <path d="M112 71 H148"/><path d="M222 71 H308"/>
  </g>
  <text x="130" y="62" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#92400e">0.5s</text>
  <text x="265" y="62" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#92400e">1.0s</text>
  <text x="470" y="76" font-family="system-ui,sans-serif" font-size="11" fill="#92400e">next would be 2.0s &#8212; <tspan font-family="ui-monospace,monospace">delay * (2 ** attempt)</tspan></text>

  <line x1="30" y1="122" x2="690" y2="122" stroke="#cbd5e1"/>

  <text x="360" y="146" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#0f172a">Retry this, not that</text>

  <rect x="30" y="158" width="322" height="118" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="46" y="180" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#14532d">Worth retrying</text>
  <g font-family="ui-monospace,monospace" font-size="12" fill="#0f172a">
    <text x="46" y="204">500, 502, 503, 504</text>
    <text x="46" y="224">Timeout</text>
    <text x="46" y="244">ConnectionError</text>
  </g>
  <text x="46" y="266" font-family="system-ui,sans-serif" font-size="11" fill="#14532d">Their problem. It might pass.</text>

  <rect x="368" y="158" width="322" height="118" rx="8" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
  <text x="384" y="180" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#991b1b">Never retry</text>
  <g font-family="ui-monospace,monospace" font-size="12" fill="#0f172a">
    <text x="384" y="204">400, 401, 403, 404</text>
    <text x="384" y="224">422</text>
  </g>
  <text x="384" y="248" font-family="system-ui,sans-serif" font-size="11" fill="#991b1b">Your problem. It will still be a 404</text>
  <text x="384" y="264" font-family="system-ui,sans-serif" font-size="11" fill="#991b1b">in a second. You just waste their quota.</text>
</svg>
