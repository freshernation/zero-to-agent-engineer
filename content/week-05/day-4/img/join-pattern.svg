<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-label="Fetch, build a lookup, then walk the main list">
  <rect width="720" height="280" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">&#8220;How much has each customer spent?&#8221; is not an endpoint</text>

  <g font-family="system-ui,sans-serif" font-size="11">
    <rect x="24" y="52" width="120" height="54" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="84" y="74" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#1e3a8a">/users</text>
    <text x="84" y="93" text-anchor="middle" fill="#475569">who they are</text>

    <rect x="24" y="116" width="120" height="54" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="84" y="138" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#1e3a8a">/orders</text>
    <text x="84" y="157" text-anchor="middle" fill="#475569">what they bought</text>

    <rect x="24" y="180" width="120" height="54" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="84" y="202" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#1e3a8a">/products</text>
    <text x="84" y="221" text-anchor="middle" fill="#475569">what things cost</text>
  </g>

  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#v1)">
    <path d="M150 79 C 180 79, 190 130, 214 140"/>
    <path d="M150 143 H214"/>
    <path d="M150 207 C 180 207, 190 156, 214 146"/>
  </g>

  <rect x="222" y="88" width="150" height="110" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="297" y="112" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#5b21b6">1. fetch each</text>
  <text x="297" y="134" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#5b21b6">2. build lookups</text>
  <text x="297" y="156" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#5b21b6">3. walk the main list</text>
  <text x="297" y="180" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">each fetched exactly once</text>

  <g stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#v2)"><path d="M378 143 H414"/></g>

  <rect x="422" y="70" width="274" height="146" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="559" y="92" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#14532d">the answer nobody serves you</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#0f172a">
    <text x="440" y="118">Ana Silva    Lisbon   3 orders  912.50</text>
    <text x="440" y="140">Ben Okafor   Porto    1 order    45.00</text>
    <text x="440" y="162">Cara Diaz    Madrid   0 orders    0.00</text>
  </g>
  <text x="440" y="192" font-family="system-ui,sans-serif" font-size="11" fill="#14532d">Combining endpoints is most of what</text>
  <text x="440" y="208" font-family="system-ui,sans-serif" font-size="11" fill="#14532d">backend work actually is.</text>

  <text x="360" y="262" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#475569">Note Cara, with zero orders. The empty case is where join code breaks.</text>

  <defs>
    <marker id="v1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
    <marker id="v2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker>
  </defs>
</svg>
