<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="The N plus 1 problem and the lookup that fixes it">
  <rect width="720" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">The N+1 problem &#8212; one of the most common causes of slow software</text>

  <rect x="24" y="46" width="330" height="230" rx="8" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
  <text x="189" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#991b1b">fetching inside the loop</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">
    <text x="40" y="92"  fill="#0f172a">for order in orders:</text>
    <text x="40" y="108" fill="#dc2626">    requests.get(f"/products/{id}")</text>
  </g>
  <g font-family="ui-monospace,monospace" font-size="10">
    <rect x="40" y="122" width="290" height="18" rx="3" fill="#fee2e2"/><text x="50" y="135" fill="#991b1b">&#8594; HTTP request  (order 1)</text>
    <rect x="40" y="144" width="290" height="18" rx="3" fill="#fee2e2"/><text x="50" y="157" fill="#991b1b">&#8594; HTTP request  (order 2)</text>
    <rect x="40" y="166" width="290" height="18" rx="3" fill="#fee2e2"/><text x="50" y="179" fill="#991b1b">&#8594; HTTP request  (order 3)</text>
    <rect x="40" y="188" width="290" height="18" rx="3" fill="#fee2e2"/><text x="50" y="201" fill="#991b1b">&#8594; ... one per order, forever</text>
  </g>
  <text x="40" y="228" font-family="system-ui,sans-serif" font-size="11" fill="#991b1b">10 orders &#8594; 10 round trips &#8594; 10 chances to fail.</text>
  <text x="40" y="246" font-family="system-ui,sans-serif" font-size="11" fill="#991b1b">10,000 orders &#8594; your program is now unusable.</text>
  <text x="40" y="266" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#991b1b">On a paid API this is also a real bill.</text>

  <rect x="374" y="46" width="322" height="230" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="535" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#14532d">fetch once, build a lookup</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">
    <text x="390" y="92"  fill="#16a34a">products = get_products()</text>
    <text x="390" y="108" fill="#16a34a">by_id = {p["id"]: p for p in products}</text>
    <text x="390" y="132" fill="#0f172a">for order in orders:</text>
    <text x="390" y="148" fill="#0f172a">    product = by_id[order["product_id"]]</text>
  </g>
  <g font-family="ui-monospace,monospace" font-size="10">
    <rect x="390" y="164" width="290" height="18" rx="3" fill="#dcfce7"/><text x="400" y="177" fill="#14532d">&#8594; ONE HTTP request, total</text>
    <rect x="390" y="186" width="290" height="18" rx="3" fill="#f1f5f9"/><text x="400" y="199" fill="#475569">then all lookups are local and instant</text>
  </g>
  <text x="390" y="228" font-family="system-ui,sans-serif" font-size="11" fill="#14532d">The dict comprehension is week 3&#8217;s. The lookup</text>
  <text x="390" y="246" font-family="system-ui,sans-serif" font-size="11" fill="#14532d">is week 2&#8217;s. Together they are the whole trick.</text>
  <text x="390" y="266" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#14532d">Say the name &#8220;N+1&#8221; in an interview.</text>
</svg>
