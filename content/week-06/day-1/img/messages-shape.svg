<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-label="The shape of a Messages API request and response">
  <rect width="720" height="320" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">One POST to /v1/messages. It is still just an HTTP API.</text>

  <rect x="24" y="46" width="330" height="192" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="189" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">what you send</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">
    <text x="40" y="92"  fill="#0f172a">client.messages.create(</text>
    <text x="40" y="110" fill="#0f172a">    model="claude-opus-5",</text>
    <text x="40" y="128" fill="#dc2626">    max_tokens=1000,</text>
    <text x="40" y="146" fill="#0f172a">    system="You are terse.",</text>
    <text x="40" y="164" fill="#0f172a">    messages=[</text>
    <text x="40" y="182" fill="#0f172a">      {"role": "user",</text>
    <text x="40" y="200" fill="#0f172a">       "content": "What is a token?"}</text>
    <text x="40" y="218" fill="#0f172a">    ])</text>
  </g>
  <text x="240" y="128" font-family="system-ui,sans-serif" font-size="10" fill="#991b1b">&#8592; required</text>
  <text x="250" y="146" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">&#8592; not a message</text>

  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#w1)"><path d="M360 142 H392"/></g>

  <rect x="400" y="46" width="296" height="192" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="548" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#14532d">what comes back</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">
    <text x="416" y="92"  fill="#0f172a">response.content</text>
    <text x="430" y="110" fill="#dc2626">a LIST of blocks, not a string</text>
    <text x="416" y="134" fill="#0f172a">response.stop_reason</text>
    <text x="430" y="152" fill="#64748b">"end_turn" | "max_tokens" | ...</text>
    <text x="416" y="176" fill="#0f172a">response.usage.input_tokens</text>
    <text x="416" y="194" fill="#0f172a">response.usage.output_tokens</text>
    <text x="416" y="218" fill="#0f172a">response.model</text>
  </g>

  <rect x="24" y="252" width="672" height="54" rx="8" fill="#fffbeb" stroke="#d97706"/>
  <text x="40" y="274" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#92400e">The safe way to get the text out</text>
  <text x="40" y="296" font-family="ui-monospace,monospace" font-size="12" fill="#0f172a">text = "".join(b.text for b in response.content if b.type == "text")</text>

  <defs><marker id="w1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs>
</svg>
