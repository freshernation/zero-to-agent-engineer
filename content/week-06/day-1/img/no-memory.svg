<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="The model has no memory - you resend the whole conversation every call">
  <rect width="720" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">The model has no memory. You resend everything, every call.</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">
    <rect x="24" y="48" width="210" height="150" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="129" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#1e3a8a">call 1 &#8212; 1 message</text>
    <rect x="38" y="80" width="182" height="22" rx="3" fill="#eff6ff"/><text x="48" y="95" fill="#0f172a">user: "What is a token?"</text>
    <text x="38" y="186" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">cheap</text>

    <rect x="254" y="48" width="210" height="150" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="359" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#1e3a8a">call 2 &#8212; 3 messages</text>
    <rect x="268" y="80" width="182" height="22" rx="3" fill="#eff6ff"/><text x="278" y="95" fill="#0f172a">user: "What is a token?"</text>
    <rect x="268" y="106" width="182" height="22" rx="3" fill="#f1f5f9"/><text x="278" y="121" fill="#475569">assistant: "A token is..."</text>
    <rect x="268" y="132" width="182" height="22" rx="3" fill="#eff6ff"/><text x="278" y="147" fill="#0f172a">user: "How many per word?"</text>
    <text x="268" y="186" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">3&#215; the input tokens</text>

    <rect x="484" y="48" width="212" height="150" rx="8" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
    <text x="590" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#991b1b">call 20 &#8212; 39 messages</text>
    <rect x="498" y="80" width="182" height="10" rx="2" fill="#fee2e2"/>
    <rect x="498" y="94" width="182" height="10" rx="2" fill="#fee2e2"/>
    <rect x="498" y="108" width="182" height="10" rx="2" fill="#fee2e2"/>
    <rect x="498" y="122" width="182" height="10" rx="2" fill="#fee2e2"/>
    <rect x="498" y="136" width="182" height="10" rx="2" fill="#fee2e2"/>
    <rect x="498" y="150" width="182" height="10" rx="2" fill="#fee2e2"/>
    <text x="498" y="176" font-family="system-ui,sans-serif" font-size="10" fill="#991b1b">every turn re-billed, every time</text>
    <text x="498" y="190" font-family="system-ui,sans-serif" font-size="10" fill="#991b1b">cost grows with the square of the chat</text>
  </g>

  <rect x="24" y="216" width="672" height="66" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="40" y="238" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">That is what a conversation IS</text>
  <text x="40" y="258" font-family="system-ui,sans-serif" font-size="11" fill="#0f172a">There is no session on the server. The whole history travels with every request &#8212; the API is stateless,</text>
  <text x="40" y="274" font-family="system-ui,sans-serif" font-size="11" fill="#0f172a">exactly like the one you called in week 5. Thursday is about deciding what to stop sending.</text>
</svg>
