<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-label="Where each part of a prompt belongs">
  <rect width="720" height="320" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Where each part belongs</text>

  <rect x="30" y="46" width="660" height="116" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="46" y="68" font-family="ui-monospace,monospace" font-size="13" font-weight="700" fill="#1e3a8a">system=</text>
  <text x="130" y="68" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">the standing instruction &#8212; applies to every turn, never changes</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#0f172a">
    <text x="46" y="92">You are a support triage assistant.</text>
    <text x="46" y="110">Rules: never promise a refund; never invent an order number.</text>
    <text x="46" y="128">Format: one line, "&lt;category&gt;: &lt;one-sentence summary&gt;". No preamble.</text>
  </g>
  <text x="46" y="152" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#1e3a8a">role &#183; rules &#183; format</text>

  <rect x="30" y="176" width="660" height="90" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="46" y="198" font-family="ui-monospace,monospace" font-size="13" font-weight="700" fill="#14532d">messages=</text>
  <text x="150" y="198" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">the actual work &#8212; changes every call</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#0f172a">
    <text x="46" y="222">{"role": "user", "content": f"""Triage this ticket.</text>
    <text x="46" y="240">&lt;ticket&gt;{ticket_text}&lt;/ticket&gt;"""}</text>
  </g>
  <text x="46" y="260" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#14532d">the task &#183; the data, fenced</text>

  <rect x="30" y="278" width="660" height="30" rx="6" fill="#fffbeb" stroke="#d97706"/>
  <text x="360" y="298" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#92400e">Stable content first, volatile content last &#8212; that ordering is also what makes prompt caching possible.</text>
</svg>
