<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="Temperature reshapes the probability distribution over the next token">
  <rect width="720" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="26" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">The model predicts a distribution. Temperature reshapes it before one is picked.</text>

  <text x="360" y="50" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#475569">"The capital of France is ___"</text>

  <rect x="30" y="64" width="322" height="196" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="191" y="86" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#14532d">temperature 0 &#8212; peaked</text>
  <g font-family="ui-monospace,monospace" font-size="11">
    <text x="46" y="112" fill="#0f172a">Paris</text>
    <rect x="110" y="102" width="220" height="14" rx="3" fill="#16a34a"/>
    <text x="46" y="138" fill="#0f172a">Lyon</text>
    <rect x="110" y="128" width="10" height="14" rx="3" fill="#86efac"/>
    <text x="46" y="164" fill="#0f172a">Nice</text>
    <rect x="110" y="154" width="5" height="14" rx="3" fill="#86efac"/>
    <text x="46" y="190" fill="#0f172a">a city</text>
    <rect x="110" y="180" width="3" height="14" rx="3" fill="#86efac"/>
  </g>
  <text x="46" y="220" font-family="system-ui,sans-serif" font-size="11" fill="#14532d">Almost always the same answer.</text>
  <text x="46" y="240" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#14532d">Use for: anything you will parse.</text>

  <rect x="368" y="64" width="322" height="196" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="529" y="86" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#92400e">temperature 1 &#8212; flatter</text>
  <g font-family="ui-monospace,monospace" font-size="11">
    <text x="384" y="112" fill="#0f172a">Paris</text>
    <rect x="448" y="102" width="150" height="14" rx="3" fill="#d97706"/>
    <text x="384" y="138" fill="#0f172a">Lyon</text>
    <rect x="448" y="128" width="52" height="14" rx="3" fill="#fbbf24"/>
    <text x="384" y="164" fill="#0f172a">Nice</text>
    <rect x="448" y="154" width="34" height="14" rx="3" fill="#fbbf24"/>
    <text x="384" y="190" fill="#0f172a">a city</text>
    <rect x="448" y="180" width="24" height="14" rx="3" fill="#fbbf24"/>
  </g>
  <text x="384" y="220" font-family="system-ui,sans-serif" font-size="11" fill="#92400e">The unlikely options get a real chance.</text>
  <text x="384" y="240" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#92400e">Use for: variety, drafts, alternatives.</text>

  <rect x="30" y="270" width="660" height="22" rx="5" fill="#fff1f2" stroke="#dc2626"/>
  <text x="360" y="285" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#991b1b">On the current 5-series models this parameter is <tspan font-weight="700">removed</tspan> &#8212; sending it returns a 400. See the article.</text>
</svg>
