<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-label="Streaming changes when text arrives, not how fast it is generated">
  <rect width="720" height="280" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Streaming changes <tspan font-style="italic">when</tspan> text arrives, not how fast it is made</text>

  <text x="30" y="60" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#991b1b">without streaming</text>
  <rect x="30" y="70" width="500" height="26" rx="4" fill="#fee2e2" stroke="#dc2626"/>
  <text x="280" y="88" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#991b1b">nothing on screen &#8212; 8 seconds of blank</text>
  <rect x="530" y="70" width="160" height="26" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="610" y="88" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#14532d">whole reply at once</text>

  <text x="30" y="130" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#14532d">with streaming</text>
  <g>
    <rect x="30" y="140" width="52" height="26" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="56" y="158" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#475569">0.4s</text>
    <rect x="86" y="140" width="604" height="26" rx="4" fill="#dcfce7" stroke="#16a34a"/>
    <text x="388" y="158" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#14532d">text appearing continuously, word by word</text>
  </g>
  <text x="30" y="188" font-family="system-ui,sans-serif" font-size="11" fill="#475569">Same total time. Same tokens. Same cost. The wait is just <tspan font-style="italic">visible</tspan> &#8212; which is worth a surprising amount.</text>

  <rect x="30" y="204" width="660" height="60" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="46" y="226" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">The two flags people forget</text>
  <text x="46" y="248" font-family="ui-monospace,monospace" font-size="12" fill="#0f172a">print(chunk, end="", flush=True)</text>
  <text x="330" y="242" font-family="system-ui,sans-serif" font-size="10" fill="#475569"><tspan font-family="ui-monospace,monospace">end=""</tspan> &#8212; no newline after every chunk</text>
  <text x="330" y="256" font-family="system-ui,sans-serif" font-size="10" fill="#475569"><tspan font-family="ui-monospace,monospace">flush=True</tspan> &#8212; without it Python buffers and it all arrives at once anyway</text>
</svg>
