<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="Trim in pairs so the history still starts with a user turn">
  <rect width="720" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Trim in pairs &#8212; a history starting with <tspan font-family="ui-monospace,monospace">assistant</tspan> is rejected</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">
    <text x="30" y="56" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#475569">full history</text>
    <rect x="30" y="64" width="180" height="20" rx="3" fill="#eff6ff" stroke="#93c5fd"/><text x="40" y="78" fill="#0f172a">user   turn 1</text>
    <rect x="30" y="88" width="180" height="20" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/><text x="40" y="102" fill="#475569">asst   turn 1</text>
    <rect x="30" y="112" width="180" height="20" rx="3" fill="#eff6ff" stroke="#93c5fd"/><text x="40" y="126" fill="#0f172a">user   turn 2</text>
    <rect x="30" y="136" width="180" height="20" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/><text x="40" y="150" fill="#475569">asst   turn 2</text>
    <rect x="30" y="160" width="180" height="20" rx="3" fill="#eff6ff" stroke="#93c5fd"/><text x="40" y="174" fill="#0f172a">user   turn 3</text>

    <text x="256" y="56" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#991b1b">keep last 4 &#8212; naive</text>
    <rect x="256" y="88" width="180" height="20" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="266" y="102" fill="#dc2626">asst   turn 1</text>
    <rect x="256" y="112" width="180" height="20" rx="3" fill="#eff6ff" stroke="#93c5fd"/><text x="266" y="126" fill="#0f172a">user   turn 2</text>
    <rect x="256" y="136" width="180" height="20" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/><text x="266" y="150" fill="#475569">asst   turn 2</text>
    <rect x="256" y="160" width="180" height="20" rx="3" fill="#eff6ff" stroke="#93c5fd"/><text x="266" y="174" fill="#0f172a">user   turn 3</text>
    <text x="256" y="200" font-family="system-ui,sans-serif" font-size="10" fill="#991b1b">starts with assistant &#8594; 400 error</text>

    <text x="482" y="56" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#14532d">keep last 3 &#8212; correct</text>
    <rect x="482" y="112" width="180" height="20" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="492" y="126" fill="#14532d">user   turn 2</text>
    <rect x="482" y="136" width="180" height="20" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/><text x="492" y="150" fill="#475569">asst   turn 2</text>
    <rect x="482" y="160" width="180" height="20" rx="3" fill="#eff6ff" stroke="#93c5fd"/><text x="492" y="174" fill="#0f172a">user   turn 3</text>
    <text x="482" y="200" font-family="system-ui,sans-serif" font-size="10" fill="#14532d">drop one more until it starts with user</text>
  </g>

  <rect x="30" y="220" width="660" height="62" rx="8" fill="#fffbeb" stroke="#d97706"/>
  <text x="46" y="242" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#92400e">The system prompt is never trimmed</text>
  <text x="46" y="262" font-family="system-ui,sans-serif" font-size="11" fill="#0f172a">It is a separate field, not part of <tspan font-family="ui-monospace,monospace">messages</tspan> &#8212; so the rules survive however much history you drop.</text>
  <text x="46" y="277" font-family="system-ui,sans-serif" font-size="11" fill="#475569">That separation is exactly why Tuesday told you to put the rules there.</text>
</svg>
