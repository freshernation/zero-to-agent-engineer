<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-label="The parts of a tool schema and which the model actually reads">
  <rect width="720" height="280" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">The description <tspan font-style="italic">is</tspan> the prompt &#8212; it is all the model knows</text>

  <rect x="30" y="46" width="380" height="200" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">
    <text x="46" y="70"  fill="#0f172a">{</text>
    <text x="46" y="88"  fill="#16a34a">  "name": "calculate",</text>
    <text x="46" y="106" fill="#d97706">  "description": "Evaluate a basic</text>
    <text x="46" y="122" fill="#d97706">     arithmetic expression like</text>
    <text x="46" y="138" fill="#d97706">     '2 + 2 * 3'. Only + - * / and</text>
    <text x="46" y="154" fill="#d97706">     parentheses.",</text>
    <text x="46" y="172" fill="#0f172a">  "input_schema": {</text>
    <text x="46" y="188" fill="#7c3aed">    "type": "object",</text>
    <text x="46" y="204" fill="#7c3aed">    "properties": {"expression": {...}},</text>
    <text x="46" y="220" fill="#7c3aed">    "required": ["expression"]</text>
    <text x="46" y="236" fill="#0f172a">  }}</text>
  </g>

  <g font-family="system-ui,sans-serif" font-size="11">
    <rect x="428" y="56" width="262" height="52" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="444" y="76" font-weight="700" fill="#14532d">name</text>
    <text x="444" y="94" fill="#475569">what you dispatch on. Keep it short.</text>

    <rect x="428" y="118" width="262" height="76" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <text x="444" y="138" font-weight="700" fill="#92400e">description &#8212; the important one</text>
    <text x="444" y="156" fill="#475569">What it does. When to use it.</text>
    <text x="444" y="172" fill="#475569">And often most usefully:</text>
    <text x="444" y="188" font-weight="700" fill="#92400e">when NOT to use it.</text>

    <rect x="428" y="204" width="262" height="56" rx="6" fill="#faf5ff" stroke="#7c3aed"/>
    <text x="444" y="224" font-weight="700" fill="#5b21b6">input_schema &#8212; plain JSON Schema</text>
    <text x="444" y="242" fill="#475569">Describe every field too. The model reads</text>
    <text x="444" y="256" fill="#475569">those descriptions as well.</text>
  </g>
</svg>
