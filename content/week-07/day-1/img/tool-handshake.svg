<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-label="The four-step tool handshake">
  <rect width="720" height="340" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">The model never runs anything. It asks. <tspan font-style="italic">You</tspan> run it.</text>

  <text x="120" y="56" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">your code</text>
  <text x="600" y="56" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#5b21b6">the model</text>
  <line x1="120" y1="64" x2="120" y2="310" stroke="#93c5fd" stroke-width="2"/>
  <line x1="600" y1="64" x2="600" y2="310" stroke="#c4b5fd" stroke-width="2"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">
    <g stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#z1)"><path d="M126 92 H594"/></g>
    <text x="360" y="86" text-anchor="middle" font-weight="700" fill="#1e3a8a">1  tools=[SCHEMA] + "What is 17 * 23?"</text>
    <text x="360" y="106" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">the schema is all it knows about your function</text>

    <g stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#z2)"><path d="M594 148 H126"/></g>
    <text x="360" y="142" text-anchor="middle" font-weight="700" fill="#5b21b6">2  stop_reason="tool_use"</text>
    <text x="360" y="164" text-anchor="middle" font-size="10" fill="#475569">ToolUseBlock(name="calculate", input={"expression": "17 * 23"}, id="toolu_01A")</text>
  </g>

  <rect x="180" y="184" width="360" height="46" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="360" y="204" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#92400e">3  YOU run it</text>
  <text x="360" y="221" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#0f172a">calculate("17 * 23")  &#8594;  "391"</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">
    <g stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#z1)"><path d="M126 258 H594"/></g>
    <text x="360" y="252" text-anchor="middle" font-weight="700" fill="#1e3a8a">4  the assistant turn, verbatim + a tool_result</text>
    <text x="360" y="274" text-anchor="middle" font-size="10" fill="#475569">{"type": "tool_result", "tool_use_id": "toolu_01A", "content": "391"}</text>
  </g>

  <rect x="30" y="292" width="660" height="34" rx="6" fill="#fff1f2" stroke="#dc2626"/>
  <text x="360" y="313" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#991b1b">Send back <tspan font-weight="700">both</tspan>: the assistant turn AND the result. Skip the assistant turn and the model has no record of asking.</text>

  <defs>
    <marker id="z1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
    <marker id="z2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker>
  </defs>
</svg>
