<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-label="The agent loop">
  <rect width="720" height="360" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">The whole agent. Every framework on earth wraps this.</text>

  <rect x="270" y="48" width="180" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="360" y="73" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#1e3a8a">messages = [question]</text>

  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#aa1)"><path d="M360 90 V112"/></g>

  <rect x="240" y="114" width="240" height="44" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="360" y="132" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#5b21b6">response = model(messages, tools)</text>
  <text x="360" y="150" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">the only call in the whole loop</text>

  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#aa1)"><path d="M360 160 V184"/></g>

  <path d="M360 186 L470 216 L360 246 L250 216 Z" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="360" y="212" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" font-weight="700" fill="#92400e">stop_reason</text>
  <text x="360" y="228" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" font-weight="700" fill="#92400e">== "tool_use"?</text>

  <g stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#aa2)"><path d="M472 216 H556"/></g>
  <text x="514" y="208" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#14532d">no</text>
  <rect x="560" y="196" width="130" height="40" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="625" y="221" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#14532d">return the text</text>

  <g stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#aa3)"><path d="M360 248 V272"/></g>
  <text x="376" y="266" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#1e3a8a">yes</text>

  <rect x="200" y="274" width="320" height="62" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="360" y="294" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#0f172a">append what the model said</text>
  <text x="360" y="310" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#0f172a">run every tool it asked for</text>
  <text x="360" y="326" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#0f172a">append the results as a user message</text>

  <g stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#aa3)">
    <path d="M198 305 H150 V136 H236"/>
  </g>
  <text x="120" y="220" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#1e3a8a">go round</text>
  <text x="122" y="236" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#1e3a8a">again</text>

  <rect x="530" y="266" width="160" height="70" rx="8" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
  <text x="610" y="288" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#991b1b">the cap</text>
  <text x="610" y="306" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#0f172a">for step in range(N)</text>
  <text x="610" y="324" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#991b1b">write this FIRST</text>

  <defs>
    <marker id="aa1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
    <marker id="aa2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker>
    <marker id="aa3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
  </defs>
</svg>
