<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-label="The message history is the agent's entire state">
  <rect width="720" height="280" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">The history <tspan font-style="italic">is</tspan> the agent&#8217;s entire state. There is nowhere else.</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">
    <rect x="60" y="50" width="600" height="22" rx="3" fill="#eff6ff" stroke="#93c5fd"/><text x="72" y="65" fill="#0f172a">user       "What is the weather in the city with the largest population?"</text>
    <rect x="60" y="78" width="600" height="22" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/><text x="72" y="93" fill="#475569">assistant  tool_use: get_population(country="world")</text>
    <rect x="60" y="106" width="600" height="22" rx="3" fill="#fffbeb" stroke="#fbbf24"/><text x="72" y="121" fill="#92400e">user       tool_result: "Tokyo, 37M"</text>
    <rect x="60" y="134" width="600" height="22" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/><text x="72" y="149" fill="#475569">assistant  tool_use: get_weather(city="Tokyo")</text>
    <rect x="60" y="162" width="600" height="22" rx="3" fill="#fffbeb" stroke="#fbbf24"/><text x="72" y="177" fill="#92400e">user       tool_result: "18C, cloudy"</text>
    <rect x="60" y="190" width="600" height="22" rx="3" fill="#dcfce7" stroke="#16a34a"/><text x="72" y="205" fill="#14532d">assistant  "Tokyo is the largest city, and it is 18C and cloudy."</text>
  </g>
  <text x="20" y="65" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">step 1</text>
  <text x="20" y="121" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">step 2</text>
  <text x="20" y="177" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">step 3</text>

  <rect x="60" y="226" width="600" height="42" rx="6" fill="#fff1f2" stroke="#dc2626"/>
  <text x="76" y="245" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#991b1b">Two entries added every pass &#8212; so a 10-step run resends 20 messages on the last call.</text>
  <text x="76" y="261" font-family="system-ui,sans-serif" font-size="11" fill="#0f172a">Drop one turn and the model loses the thread completely. &#8220;Agent memory&#8221; is a strategy for this list.</text>
</svg>
