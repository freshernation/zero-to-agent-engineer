<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="Sequential versus concurrent tool calls">
  <rect width="720" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Async does not make anything faster. It stops you sitting idle.</text>

  <text x="30" y="58" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#991b1b">sequential &#8212; 0.3s</text>
  <g>
    <rect x="30" y="66" width="190" height="26" rx="4" fill="#fee2e2" stroke="#dc2626"/>
    <text x="125" y="84" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#991b1b">lookup A &#8212; waiting</text>
    <rect x="224" y="66" width="190" height="26" rx="4" fill="#fee2e2" stroke="#dc2626"/>
    <text x="319" y="84" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#991b1b">lookup B &#8212; waiting</text>
    <rect x="418" y="66" width="190" height="26" rx="4" fill="#fee2e2" stroke="#dc2626"/>
    <text x="513" y="84" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#991b1b">lookup C &#8212; waiting</text>
  </g>
  <text x="30" y="110" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">Your program does nothing at all for 0.3 seconds. The network is doing the work.</text>

  <text x="30" y="146" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#14532d">concurrent &#8212; 0.1s</text>
  <g>
    <rect x="30" y="154" width="190" height="20" rx="4" fill="#dcfce7" stroke="#16a34a"/>
    <text x="125" y="169" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#14532d">lookup A</text>
    <rect x="30" y="178" width="190" height="20" rx="4" fill="#dcfce7" stroke="#16a34a"/>
    <text x="125" y="193" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#14532d">lookup B</text>
    <rect x="30" y="202" width="190" height="20" rx="4" fill="#dcfce7" stroke="#16a34a"/>
    <text x="125" y="217" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#14532d">lookup C</text>
  </g>
  <text x="240" y="190" font-family="system-ui,sans-serif" font-size="11" fill="#14532d">All three waits overlap. Same total work,</text>
  <text x="240" y="206" font-family="system-ui,sans-serif" font-size="11" fill="#14532d">one third of the wall-clock time.</text>

  <rect x="30" y="238" width="330" height="50" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="46" y="258" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#14532d">Async helps: waiting on the network</text>
  <text x="46" y="276" font-family="system-ui,sans-serif" font-size="11" fill="#0f172a">API calls, HTTP, disk, databases</text>

  <rect x="376" y="238" width="320" height="50" rx="6" fill="#fff1f2" stroke="#dc2626"/>
  <text x="392" y="258" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#991b1b">Async does not help: doing arithmetic</text>
  <text x="392" y="276" font-family="system-ui,sans-serif" font-size="11" fill="#0f172a">Heavy computation needs processes, not async</text>
</svg>
