<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="State, nodes and edges - and the same three parts in week 7's loop">
  <rect width="720" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Three parts &#8212; and your week 7 loop had all three</text>

  <ellipse cx="120" cy="90" rx="42" ry="24" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="120" y="95" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#475569">START</text>

  <rect x="220" y="66" width="130" height="48" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="285" y="88" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#1e3a8a">increment</text>
  <text x="285" y="104" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">a node</text>

  <path d="M470 90 L530 66 L590 90 L530 114 Z" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="530" y="88" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" font-weight="700" fill="#92400e">route()</text>
  <text x="530" y="102" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#92400e">conditional edge</text>

  <ellipse cx="660" cy="160" rx="34" ry="22" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="660" y="165" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#14532d">END</text>

  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#ac1)">
    <path d="M164 90 H214"/><path d="M352 90 H466"/>
  </g>
  <g stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#ac2)"><path d="M568 104 C 610 120, 630 138, 640 146"/></g>
  <text x="612" y="120" font-family="system-ui,sans-serif" font-size="10" fill="#14532d">done</text>
  <g stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#ac3)"><path d="M530 116 V152 H285 V120"/></g>
  <text x="400" y="146" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#1e3a8a">not done &#8212; return the node&#8217;s own name = a loop</text>

  <line x1="30" y1="176" x2="690" y2="176" stroke="#cbd5e1"/>

  <g font-family="system-ui,sans-serif" font-size="12">
    <text x="30" y="200" font-weight="700" fill="#0f172a">The same three parts, in week 7</text>
    <rect x="30" y="210" width="212" height="72" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="46" y="230" font-weight="700" fill="#475569">state</text>
    <text x="46" y="250" font-family="ui-monospace,monospace" font-size="11" fill="#0f172a">messages = [...]</text>
    <text x="46" y="270" font-size="10" fill="#64748b">the list you kept appending to</text>

    <rect x="254" y="210" width="212" height="72" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="270" y="230" font-weight="700" fill="#475569">nodes</text>
    <text x="270" y="250" font-family="ui-monospace,monospace" font-size="11" fill="#0f172a">call the model / run tools</text>
    <text x="270" y="270" font-size="10" fill="#64748b">the two halves of your loop body</text>

    <rect x="478" y="210" width="212" height="72" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="494" y="230" font-weight="700" fill="#475569">edges</text>
    <text x="494" y="250" font-family="ui-monospace,monospace" font-size="11" fill="#0f172a">if stop_reason == ...</text>
    <text x="494" y="270" font-size="10" fill="#64748b">the branch the loop turned on</text>
  </g>

  <defs>
    <marker id="ac1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
    <marker id="ac2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker>
    <marker id="ac3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
  </defs>
</svg>
