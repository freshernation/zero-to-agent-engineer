<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" role="img" aria-label="invoke gives the final state, stream gives one update per node">
  <rect width="720" height="290" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">The trace, produced by the framework instead of appended by hand</text>

  <rect x="24" y="46" width="200" height="200" rx="8" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
  <text x="124" y="68" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" font-weight="700" fill="#991b1b">app.invoke(...)</text>
  <rect x="40" y="82" width="168" height="120" rx="5" fill="#ffffff" stroke="#fca5a5"/>
  <text x="124" y="146" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#991b1b">the final state</text>
  <text x="124" y="164" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#991b1b">and nothing else</text>
  <text x="40" y="224" font-family="system-ui,sans-serif" font-size="10" fill="#991b1b">When it goes wrong you cannot see</text>
  <text x="40" y="238" font-family="system-ui,sans-serif" font-size="10" fill="#991b1b">which node did it.</text>

  <rect x="248" y="46" width="448" height="200" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="472" y="68" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" font-weight="700" fill="#14532d">for update in app.stream(...)</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10">
    <rect x="264" y="82" width="416" height="30" rx="4" fill="#ffffff" stroke="#86efac"/>
    <text x="276" y="101" fill="#0f172a">{"model": {"messages": [AIMessage(tool_calls=...)], "steps": 1}}</text>
    <rect x="264" y="118" width="416" height="30" rx="4" fill="#ffffff" stroke="#86efac"/>
    <text x="276" y="137" fill="#0f172a">{"tools": {"messages": [ToolMessage("391")]}}</text>
    <rect x="264" y="154" width="416" height="30" rx="4" fill="#ffffff" stroke="#86efac"/>
    <text x="276" y="173" fill="#0f172a">{"model": {"messages": [AIMessage("It is 391.")], "steps": 2}}</text>
  </g>
  <text x="264" y="206" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#14532d">The key is the node name. The value is what it returned.</text>
  <text x="264" y="226" font-family="system-ui,sans-serif" font-size="11" fill="#0f172a">node_sequence = ["model", "tools", "model"] &#8212; and you did not write it.</text>

  <rect x="24" y="256" width="672" height="26" rx="5" fill="#eff6ff" stroke="#2563eb"/>
  <text x="360" y="273" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1e3a8a">Three stream modes: <tspan font-family="ui-monospace,monospace" font-weight="700">"updates"</tspan> per node (debugging) &#183; <tspan font-family="ui-monospace,monospace">"values"</tspan> whole state &#183; <tspan font-family="ui-monospace,monospace">"messages"</tspan> tokens (user-facing)</text>
</svg>
