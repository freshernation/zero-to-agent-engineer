<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" role="img" aria-label="The chunk size trade-off">
  <rect width="720" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">There is no correct chunk size. There is only what measures better.</text>

  <rect x="30" y="46" width="322" height="150" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="191" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">smaller chunks</text>
  <g font-family="system-ui,sans-serif" font-size="11">
    <text x="46" y="94" fill="#14532d">+ more precise &#8212; less irrelevant text</text>
    <text x="46" y="114" fill="#14532d">+ the match is about one thing</text>
    <text x="46" y="140" fill="#991b1b">&#8211; answers get split across boundaries</text>
    <text x="46" y="160" fill="#991b1b">&#8211; the answer arrives without its context</text>
    <text x="46" y="180" fill="#991b1b">&#8211; more chunks to search</text>
  </g>

  <rect x="368" y="46" width="322" height="150" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="529" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#5b21b6">larger chunks</text>
  <g font-family="system-ui,sans-serif" font-size="11">
    <text x="384" y="94" fill="#14532d">+ the answer arrives with its surroundings</text>
    <text x="384" y="114" fill="#14532d">+ fewer chunks, cheaper to index</text>
    <text x="384" y="140" fill="#991b1b">&#8211; more competing text dilutes the match</text>
    <text x="384" y="160" fill="#991b1b">&#8211; more tokens per retrieved chunk</text>
    <text x="384" y="180" fill="#991b1b">&#8211; the relevant sentence gets buried</text>
  </g>

  <rect x="30" y="208" width="660" height="30" rx="6" fill="#fffbeb" stroke="#d97706"/>
  <text x="360" y="228" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#92400e">200&#8211;800 characters is a reasonable place to start. <tspan font-weight="700">&#8220;We measured it&#8221; is a better interview answer than any number.</tspan></text>
</svg>
