<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" role="img" aria-label="TF-IDF weights distinctive words highly and common words at nothing">
  <rect width="720" height="290" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">TF-IDF is one sentence: how often here, times how rare everywhere</text>

  <rect x="30" y="46" width="200" height="90" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">TF &#8212; term frequency</text>
  <text x="130" y="90" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#0f172a">how often the word</text>
  <text x="130" y="106" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#0f172a">appears in <tspan font-style="italic">this</tspan> chunk</text>
  <text x="130" y="126" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">local</text>

  <text x="250" y="96" text-anchor="middle" font-family="ui-monospace,monospace" font-size="20" fill="#475569">&#215;</text>

  <rect x="270" y="46" width="200" height="90" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="370" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#5b21b6">IDF &#8212; inverse doc freq</text>
  <text x="370" y="90" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#0f172a">how <tspan font-style="italic">rare</tspan> the word is</text>
  <text x="370" y="106" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#0f172a">across the whole collection</text>
  <text x="370" y="126" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">global</text>

  <text x="490" y="96" text-anchor="middle" font-family="ui-monospace,monospace" font-size="20" fill="#475569">=</text>

  <rect x="510" y="46" width="180" height="90" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#14532d">a weight</text>
  <text x="600" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#0f172a">high for words that</text>
  <text x="600" y="110" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#0f172a">are <tspan font-weight="700">distinctive here</tspan></text>

  <line x1="30" y1="154" x2="690" y2="154" stroke="#cbd5e1"/>

  <text x="30" y="178" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#0f172a">Across six documents:</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">
    <text x="46" y="204" fill="#0f172a">"the"</text>
    <text x="140" y="204" fill="#64748b">in all 6 documents</text>
    <rect x="300" y="194" width="6" height="12" fill="#94a3b8"/>
    <text x="330" y="204" fill="#991b1b">weight &#8776; 0 &#8212; tells you nothing</text>

    <text x="46" y="230" fill="#0f172a">"claims"</text>
    <text x="140" y="230" fill="#64748b">in 2 documents</text>
    <rect x="300" y="220" width="90" height="12" fill="#60a5fa"/>
    <text x="410" y="230" fill="#1e3a8a">useful</text>

    <text x="46" y="256" fill="#0f172a">"escalation"</text>
    <text x="140" y="256" fill="#64748b">in 1 document</text>
    <rect x="300" y="246" width="170" height="12" fill="#16a34a"/>
    <text x="490" y="256" fill="#14532d">very distinctive</text>
  </g>
  <text x="30" y="280" font-family="system-ui,sans-serif" font-size="11" fill="#92400e">The IDF depends on the <tspan font-weight="700">whole collection</tspan> &#8212; so adding documents changes every existing vector. Rebuild the index.</text>
</svg>
