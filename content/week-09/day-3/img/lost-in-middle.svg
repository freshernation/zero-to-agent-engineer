<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" width="720" height="230" role="img" aria-label="Models attend most reliably to the start and end of a long context">
  <rect width="720" height="230" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Lost in the middle &#8212; a chunk can be present and still overlooked</text>

  <path d="M60 150 C 140 60, 200 60, 240 110 C 300 180, 420 180, 480 110 C 520 60, 580 60, 660 150" fill="none" stroke="#7c3aed" stroke-width="3"/>
  <text x="40" y="160" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">attention</text>

  <g font-family="system-ui,sans-serif" font-size="11">
    <text x="90" y="180" fill="#14532d" font-weight="700">start</text>
    <text x="82" y="196" fill="#14532d">reliable</text>
    <text x="345" y="200" fill="#991b1b" font-weight="700">middle</text>
    <text x="336" y="216" fill="#991b1b">least reliable</text>
    <text x="620" y="180" fill="#14532d" font-weight="700">end</text>
    <text x="612" y="196" fill="#14532d">reliable</text>
  </g>

  <g font-family="ui-monospace,monospace" font-size="10">
    <rect x="60" y="58" width="90" height="18" rx="3" fill="#dcfce7" stroke="#16a34a"/><text x="105" y="71" text-anchor="middle" fill="#14532d">chunk 1</text>
    <rect x="320" y="58" width="90" height="18" rx="3" fill="#fee2e2" stroke="#dc2626"/><text x="365" y="71" text-anchor="middle" fill="#991b1b">chunk 5</text>
    <rect x="570" y="58" width="90" height="18" rx="3" fill="#dcfce7" stroke="#16a34a"/><text x="615" y="71" text-anchor="middle" fill="#14532d">chunk 9</text>
  </g>

  <rect x="30" y="96" width="240" height="0" fill="none"/>
  <rect x="440" y="88" width="250" height="0" fill="none"/>

  <rect x="180" y="96" width="360" height="46" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="360" y="116" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">Two practical consequences</text>
  <text x="360" y="134" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#0f172a">Keep k small &#183; put the best chunk FIRST</text>
</svg>
