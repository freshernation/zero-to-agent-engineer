<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-label="RAG is search results pasted into a prompt">
  <rect width="720" height="280" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">RAG is search results pasted into a prompt. That is not a simplification.</text>

  <g font-family="system-ui,sans-serif" font-size="11">
    <rect x="24" y="52" width="140" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="94" y="76" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">the question</text>
    <text x="94" y="94" text-anchor="middle" fill="#475569">from a person</text>

    <rect x="188" y="52" width="140" height="56" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="258" y="76" text-anchor="middle" font-size="12" font-weight="600" fill="#5b21b6">search the store</text>
    <text x="258" y="94" text-anchor="middle" fill="#475569">Monday + Tuesday</text>

    <rect x="352" y="52" width="140" height="56" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <text x="422" y="76" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">build the prompt</text>
    <text x="422" y="94" text-anchor="middle" fill="#475569">an f-string</text>

    <rect x="516" y="52" width="180" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="606" y="76" text-anchor="middle" font-size="12" font-weight="600" fill="#14532d">ask the model</text>
    <text x="606" y="94" text-anchor="middle" fill="#475569">week 6</text>
  </g>
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#ae1)">
    <path d="M166 80 H184"/><path d="M330 80 H348"/><path d="M494 80 H512"/>
  </g>

  <text x="30" y="140" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#0f172a">The context block &#8212; label every chunk</text>
  <rect x="30" y="150" width="400" height="112" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">
    <text x="46" y="172" fill="#7c3aed" font-weight="700">[expenses.md#2]</text>
    <text x="46" y="190" fill="#0f172a">Claims are submitted monthly and must</text>
    <text x="46" y="206" fill="#0f172a">be in by the fifth of the following month.</text>
    <text x="46" y="230" fill="#7c3aed" font-weight="700">[oncall.md#0]</text>
    <text x="46" y="248" fill="#0f172a">The on-call rotation is one week long...</text>
  </g>

  <rect x="446" y="150" width="244" height="112" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="462" y="172" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#92400e">Two reasons for the label</text>
  <text x="462" y="194" font-family="system-ui,sans-serif" font-size="11" fill="#0f172a">1. The model can cite it</text>
  <text x="462" y="216" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#92400e">2. YOU can check the citation</text>
  <text x="462" y="240" font-family="system-ui,sans-serif" font-size="10" fill="#92400e">An unverifiable answer is how people end</text>
  <text x="462" y="254" font-family="system-ui,sans-serif" font-size="10" fill="#92400e">up trusting a confidently wrong system.</text>

  <defs><marker id="ae1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs>
</svg>
