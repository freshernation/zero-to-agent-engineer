<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="A checkpointer saves state after every node, giving you a time machine">
  <rect width="720" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">A checkpoint after every node &#8212; so the run can be resumed from any of them</text>

  <line x1="60" y1="110" x2="660" y2="110" stroke="#94a3b8" stroke-width="2"/>

  <g font-family="ui-monospace,monospace" font-size="11">
    <circle cx="110" cy="110" r="10" fill="#2563eb"/><text x="110" y="90" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#1e3a8a">node A</text>
    <rect x="60" y="126" width="100" height="34" rx="4" fill="#ffffff" stroke="#93c5fd"/>
    <text x="110" y="147" text-anchor="middle" fill="#0f172a">count=1</text>

    <circle cx="260" cy="110" r="10" fill="#2563eb"/><text x="260" y="90" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#1e3a8a">node B</text>
    <rect x="210" y="126" width="100" height="34" rx="4" fill="#ffffff" stroke="#93c5fd"/>
    <text x="260" y="147" text-anchor="middle" fill="#0f172a">count=2</text>

    <circle cx="410" cy="110" r="10" fill="#d97706"/><text x="410" y="90" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#92400e">node C</text>
    <rect x="360" y="126" width="100" height="34" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <text x="410" y="147" text-anchor="middle" fill="#0f172a">count=3</text>

    <circle cx="560" cy="110" r="10" fill="#16a34a"/><text x="560" y="90" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#14532d">node D</text>
    <rect x="510" y="126" width="100" height="34" rx="4" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="560" y="147" text-anchor="middle" fill="#0f172a">count=4</text>
  </g>

  <g stroke="#d97706" stroke-width="2" fill="none" marker-end="url(#af1)">
    <path d="M560 172 C 520 200, 450 200, 412 174"/>
  </g>
  <text x="486" y="204" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#92400e">rewind, change one value, carry on</text>
  <text x="486" y="220" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#92400e">update_state(config, {...})</text>

  <rect x="30" y="236" width="322" height="52" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="46" y="256" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">thread_id names one run</text>
  <text x="46" y="276" font-family="system-ui,sans-serif" font-size="11" fill="#0f172a">Two users, two ids, no interference.</text>

  <rect x="368" y="236" width="322" height="52" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="384" y="256" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#14532d">the storage is a one-line swap</text>
  <text x="384" y="276" font-family="ui-monospace,monospace" font-size="10" fill="#0f172a">MemorySaver &#8594; SqliteSaver &#8594; PostgresSaver</text>

  <defs><marker id="af1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker></defs>
</svg>
