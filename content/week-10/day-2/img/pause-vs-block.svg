<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" role="img" aria-label="A pause with persistence versus a blocked thread">
  <rect width="720" height="290" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">A pause without persistence is just a blocked thread</text>

  <rect x="30" y="46" width="322" height="200" rx="8" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
  <text x="191" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#991b1b">an <tspan font-family="ui-monospace,monospace">input()</tspan> in your week 7 loop</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">
    <text x="46" y="94" fill="#0f172a">if tool_is_risky(name):</text>
    <text x="46" y="112" fill="#dc2626">    if input("ok? ") != "y":</text>
    <text x="46" y="130" fill="#0f172a">        return "refused"</text>
  </g>
  <g font-family="system-ui,sans-serif" font-size="11" fill="#991b1b">
    <text x="46" y="160">&#8226; holds a whole process open, doing nothing</text>
    <text x="46" y="180">&#8226; dies completely on a restart or a deploy</text>
    <text x="46" y="200">&#8226; cannot be resumed by a different machine</text>
    <text x="46" y="220">&#8226; one user at a time</text>
    <text x="46" y="240" font-weight="700">&#8226; useless for &#8220;approve this tomorrow&#8221;</text>
  </g>

  <rect x="368" y="46" width="322" height="200" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="529" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#14532d">interrupt_before + a checkpointer</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">
    <text x="384" y="94" fill="#0f172a">app = graph.compile(</text>
    <text x="384" y="112" fill="#16a34a">    checkpointer=MemorySaver(),</text>
    <text x="384" y="130" fill="#16a34a">    interrupt_before=["spend"])</text>
  </g>
  <g font-family="system-ui,sans-serif" font-size="11" fill="#14532d">
    <text x="384" y="160">&#8226; the graph <tspan font-weight="700">returns</tspan>; the process is free</text>
    <text x="384" y="180">&#8226; the state is on disk, surviving a restart</text>
    <text x="384" y="200">&#8226; any machine can resume it</text>
    <text x="384" y="220">&#8226; thousands of paused threads at once</text>
    <text x="384" y="240" font-weight="700">&#8226; resume with <tspan font-family="ui-monospace,monospace">invoke(None, config)</tspan></text>
  </g>

  <rect x="30" y="258" width="660" height="24" rx="5" fill="#eff6ff" stroke="#2563eb"/>
  <text x="360" y="274" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1e3a8a">Being able to say that difference out loud is worth more than knowing the API.</text>
</svg>
