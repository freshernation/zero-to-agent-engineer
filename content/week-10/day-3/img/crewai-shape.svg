<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="CrewAI's model: agents, tasks and a sequential process">
  <rect width="720" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Agents, Tasks, Crew &#8212; and the handoff is a <tspan font-style="italic">string</tspan></text>

  <g font-family="system-ui,sans-serif" font-size="11">
    <rect x="30" y="52" width="180" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="120" y="74" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Task 1 &#8212; research</text>
    <text x="46" y="96" fill="#475569">agent: Researcher</text>
    <text x="46" y="114" fill="#475569">tools: city_info</text>
    <text x="46" y="130" fill="#475569">expected_output: a number</text>

    <rect x="270" y="52" width="180" height="84" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="360" y="74" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">Task 2 &#8212; draft</text>
    <text x="286" y="96" fill="#475569">agent: Writer</text>
    <text x="286" y="114" fill="#475569">tools: none</text>
    <text x="286" y="130" fill="#475569">expected_output: a paragraph</text>

    <rect x="510" y="52" width="180" height="84" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="600" y="74" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">Task 3 &#8212; edit</text>
    <text x="526" y="96" fill="#475569">agent: Editor</text>
    <text x="526" y="114" fill="#475569">tools: none</text>
    <text x="526" y="130" fill="#475569">expected_output: final text</text>
  </g>

  <g stroke="#d97706" stroke-width="2" fill="none" marker-end="url(#ag1)">
    <path d="M214 94 H264"/><path d="M454 94 H504"/>
  </g>
  <text x="239" y="86" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#92400e">a string</text>
  <text x="479" y="86" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#92400e">a string</text>

  <rect x="30" y="156" width="322" height="60" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="46" y="178" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#92400e">The backstory is prompt engineering</text>
  <text x="46" y="198" font-family="system-ui,sans-serif" font-size="11" fill="#0f172a"><tspan font-family="ui-monospace,monospace">role</tspan> + <tspan font-family="ui-monospace,monospace">goal</tspan> + <tspan font-family="ui-monospace,monospace">backstory</tspan> become a system prompt.</text>
  <text x="46" y="212" font-family="system-ui,sans-serif" font-size="10" fill="#92400e">A vague backstory gives a vague agent, exactly as in week 6.</text>

  <rect x="368" y="156" width="322" height="60" rx="8" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
  <text x="384" y="178" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#991b1b">What crosses the handoff</text>
  <text x="384" y="198" font-family="system-ui,sans-serif" font-size="11" fill="#0f172a">A string. Tool results, reasoning, everything</text>
  <text x="384" y="212" font-family="system-ui,sans-serif" font-size="11" fill="#0f172a">Task 1 saw and did not mention &#8212; gone.</text>

  <rect x="30" y="230" width="660" height="56" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="46" y="252" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">Four decisions CrewAI made for you</text>
  <text x="46" y="272" font-family="system-ui,sans-serif" font-size="11" fill="#0f172a">tasks run in a fixed order &#183; the handoff is a string &#183; agents have personas &#183; <tspan font-weight="700">the loop is hidden</tspan></text>
</svg>
