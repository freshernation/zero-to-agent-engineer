<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="An orchestrator sends a brief to each worker and receives a report. Each worker has its own context and its own tools.">
  <rect width="720" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Only two strings cross each line: a brief down, a report back</text>

  <rect x="250" y="48" width="220" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="360" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">orchestrator</text>
  <text x="360" y="92" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1e3a8a">holds no tools. It can only ask.</text>

  <line x1="310" y1="110" x2="190" y2="176" stroke="#475569" stroke-width="1.5"/>
  <line x1="410" y1="110" x2="530" y2="176" stroke="#475569" stroke-width="1.5"/>
  <text x="212" y="140" text-anchor="end" font-family="system-ui,sans-serif" font-size="11" fill="#475569">brief &#8595;  report &#8593;</text>
  <text x="508" y="140" font-family="system-ui,sans-serif" font-size="11" fill="#475569">brief &#8595;  report &#8593;</text>

  <rect x="60" y="176" width="260" height="92" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="190" y="198" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#14532d">researcher</text>
  <text x="76" y="220" font-family="system-ui,sans-serif" font-size="11" fill="#14532d">its own conversation, starting empty</text>
  <text x="76" y="238" font-family="system-ui,sans-serif" font-size="11" fill="#14532d">its own model</text>
  <text x="76" y="256" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#0f172a">tools: lookup_population</text>

  <rect x="400" y="176" width="260" height="92" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="530" y="198" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#14532d">analyst</text>
  <text x="416" y="220" font-family="system-ui,sans-serif" font-size="11" fill="#14532d">its own conversation, starting empty</text>
  <text x="416" y="238" font-family="system-ui,sans-serif" font-size="11" fill="#14532d">its own model</text>
  <text x="416" y="256" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#0f172a">tools: calculate</text>
</svg>
