<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-label="A request id turns interleaved logs into one readable story">
  <rect width="720" height="260" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">One id, on every line, turns &#8220;something broke&#8221; into one readable story</text>

  <rect x="24" y="46" width="330" height="176" rx="8" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
  <text x="189" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#991b1b">without a request id</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#0f172a">
    <text x="38" y="92">received</text>
    <text x="38" y="110">received</text>
    <text x="38" y="128">retrieved sources=3</text>
    <text x="38" y="146">received</text>
    <text x="38" y="164">error: timeout</text>
    <text x="38" y="182">answered duration_ms=1240</text>
  </g>
  <text x="38" y="208" font-family="system-ui,sans-serif" font-size="11" fill="#991b1b">Which request timed out? Unanswerable.</text>

  <rect x="368" y="46" width="328" height="176" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="532" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#14532d">with a request id</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10">
    <text x="382" y="92"  fill="#2563eb">a3f1</text><text x="424" y="92"  fill="#0f172a">received</text>
    <text x="382" y="110" fill="#7c3aed">b8c2</text><text x="424" y="110" fill="#0f172a">received</text>
    <text x="382" y="128" fill="#2563eb">a3f1</text><text x="424" y="128" fill="#0f172a">retrieved sources=3</text>
    <text x="382" y="146" fill="#16a34a">c091</text><text x="424" y="146" fill="#0f172a">received</text>
    <text x="382" y="164" fill="#7c3aed">b8c2</text><text x="424" y="164" fill="#dc2626">error: timeout</text>
    <text x="382" y="182" fill="#2563eb">a3f1</text><text x="424" y="182" fill="#0f172a">answered duration_ms=1240</text>
  </g>
  <text x="382" y="208" font-family="system-ui,sans-serif" font-size="11" fill="#14532d">Filter on <tspan font-family="ui-monospace,monospace" font-weight="700">b8c2</tspan> and read that one story.</text>

  <rect x="24" y="230" width="672" height="22" rx="5" fill="#eff6ff" stroke="#2563eb"/>
  <text x="360" y="245" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1e3a8a">Return the id in the response too &#8212; then a user reporting a problem can tell you which request it was.</text>
</svg>
