<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="A trace is a tree of timings that turns it is slow into a specific answer">
  <rect width="720" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">A log line says something happened. A trace says how long, and what it was inside.</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">
    <text x="40" y="66" fill="#0f172a">request</text>
    <rect x="200" y="54" width="440" height="18" rx="3" fill="#c7d2fe" stroke="#6366f1"/>
    <text x="654" y="67" fill="#475569" font-size="11">1240ms</text>

    <text x="60" y="94" fill="#0f172a">retrieve</text>
    <rect x="200" y="82" width="50" height="18" rx="3" fill="#bfdbfe" stroke="#2563eb"/>
    <text x="654" y="95" fill="#475569" font-size="11">140ms</text>

    <text x="80" y="122" fill="#0f172a">embed</text>
    <rect x="200" y="110" width="5" height="18" rx="2" fill="#93c5fd" stroke="#2563eb"/>
    <text x="654" y="123" fill="#475569" font-size="11">12ms</text>

    <text x="80" y="150" fill="#0f172a">search</text>
    <rect x="205" y="138" width="45" height="18" rx="2" fill="#93c5fd" stroke="#2563eb"/>
    <text x="654" y="151" fill="#475569" font-size="11">126ms</text>

    <text x="60" y="178" fill="#0f172a">generate</text>
    <rect x="250" y="166" width="388" height="18" rx="3" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
    <text x="654" y="179" fill="#991b1b" font-size="11" font-weight="700">1090ms</text>
  </g>

  <rect x="40" y="200" width="600" height="34" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="340" y="222" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#14532d">&#8220;It is slow&#8221; becomes &#8220;generation is 88% of it, and retrieval is not the problem&#8221;.</text>

  <rect x="40" y="246" width="290" height="42" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="56" y="264" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#1e3a8a">Use <tspan font-family="ui-monospace,monospace">time.monotonic</tspan>, not <tspan font-family="ui-monospace,monospace">time.time</tspan></text>
  <text x="56" y="280" font-family="system-ui,sans-serif" font-size="10" fill="#0f172a">Wall clock can go backwards on a time sync.</text>

  <rect x="350" y="246" width="290" height="42" rx="6" fill="#fffbeb" stroke="#d97706"/>
  <text x="366" y="264" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#92400e">Inject the clock</text>
  <text x="366" y="280" font-family="system-ui,sans-serif" font-size="10" fill="#0f172a">Real time in production, a fake one in tests.</text>
</svg>
