<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" role="img" aria-label="A request model does three jobs at once">
  <rect width="720" height="290" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">One model, three jobs &#8212; and you wrote no code for any of them</text>

  <rect x="200" y="46" width="320" height="72" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">
    <text x="216" y="68" fill="#0f172a">class AskRequest(BaseModel):</text>
    <text x="216" y="86" fill="#0f172a">    question: str = Field(min_length=1, max_length=500)</text>
    <text x="216" y="104" fill="#0f172a">    k: int = Field(default=3, ge=1, le=10)</text>
  </g>

  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#ah1)">
    <path d="M300 120 C 280 140, 180 145, 140 158"/>
    <path d="M360 120 V158"/>
    <path d="M420 120 C 440 140, 540 145, 580 158"/>
  </g>

  <g font-family="system-ui,sans-serif" font-size="11">
    <rect x="30" y="164" width="212" height="96" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="136" y="186" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">1. validates</text>
    <text x="46" y="208" fill="#0f172a">A request missing <tspan font-family="ui-monospace,monospace">question</tspan></text>
    <text x="46" y="224" fill="#0f172a">gets a <tspan font-weight="700">422</tspan> naming the field,</text>
    <text x="46" y="240" fill="#0f172a">before your code runs.</text>

    <rect x="254" y="164" width="212" height="96" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="360" y="186" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">2. documents</text>
    <text x="270" y="208" fill="#0f172a">FastAPI generates OpenAPI</text>
    <text x="270" y="224" fill="#0f172a">from it. Visit <tspan font-family="ui-monospace,monospace">/docs</tspan> and</text>
    <text x="270" y="240" fill="#0f172a">try the endpoint in a browser.</text>

    <rect x="478" y="164" width="212" height="96" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <text x="584" y="186" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">3. protects</text>
    <text x="494" y="208" fill="#0f172a"><tspan font-family="ui-monospace,monospace">max_length=500</tspan> is not</text>
    <text x="494" y="224" fill="#0f172a">tidiness. Without it someone</text>
    <text x="494" y="240" fill="#0f172a">posts a megabyte and you pay</text>
    <text x="494" y="256" fill="#0f172a">a model to read it.</text>
  </g>

  <defs><marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs>
</svg>
