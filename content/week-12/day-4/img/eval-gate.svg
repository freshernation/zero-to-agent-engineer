<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="An eval gate blocks a deploy; guardrails block a request">
  <rect width="720" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Evaluation stops bad <tspan font-style="italic">changes</tspan>. Guardrails stop bad <tspan font-style="italic">requests</tspan>.</text>

  <rect x="24" y="46" width="672" height="106" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="40" y="68" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">the eval gate &#8212; runs before a deploy</text>
  <g font-family="system-ui,sans-serif" font-size="11">
    <rect x="44" y="80" width="130" height="48" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="109" y="100" text-anchor="middle" font-weight="600" fill="#0f172a">run the</text>
    <text x="109" y="116" text-anchor="middle" font-weight="600" fill="#0f172a">golden set</text>

    <rect x="212" y="80" width="150" height="48" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="287" y="100" text-anchor="middle" font-weight="600" fill="#0f172a">compare to</text>
    <text x="287" y="116" text-anchor="middle" font-weight="600" fill="#0f172a">thresholds</text>

    <rect x="400" y="80" width="130" height="48" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="465" y="108" text-anchor="middle" font-weight="700" fill="#14532d">pass &#8594; deploy</text>

    <rect x="552" y="80" width="130" height="48" rx="6" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
    <text x="617" y="108" text-anchor="middle" font-weight="700" fill="#991b1b">fail &#8594; do not</text>
  </g>
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#aj1)">
    <path d="M178 104 H208"/><path d="M366 104 H396"/>
  </g>
  <text x="40" y="146" font-family="system-ui,sans-serif" font-size="11" fill="#1e3a8a">A number nobody acts on is a number nobody looks at. A number that stops a deploy gets looked at every time.</text>

  <rect x="24" y="166" width="672" height="118" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="40" y="188" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#92400e">the guardrails &#8212; run on every request</text>
  <g font-family="system-ui,sans-serif" font-size="11">
    <text x="46" y="212" font-weight="700" fill="#0f172a">question length</text>
    <text x="240" y="212" fill="#475569">somebody posting a megabyte you pay to read</text>
    <text x="46" y="232" font-weight="700" fill="#0f172a">cost budget per request</text>
    <text x="240" y="232" fill="#475569">a runaway agent loop</text>
    <text x="46" y="252" font-weight="700" fill="#0f172a">cost budget per day</text>
    <text x="240" y="252" fill="#991b1b">a runaway loop that restarts &#8212; the one people learn about from an invoice</text>
    <text x="46" y="272" font-weight="700" fill="#0f172a">iteration cap</text>
    <text x="240" y="272" fill="#475569">week 7&#8217;s, still earning its place</text>
  </g>

  <defs><marker id="aj1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs>
</svg>
