<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-label="The four beats of a two-minute project story">
  <rect width="720" height="280" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Two minutes, four beats, in this order</text>

  <g font-family="system-ui,sans-serif" font-size="11">
    <rect x="30" y="46" width="660" height="46" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <circle cx="54" cy="69" r="14" fill="#2563eb"/><text x="54" y="74" text-anchor="middle" fill="#fff" font-weight="700" font-size="13">1</text>
    <text x="80" y="66" font-size="13" font-weight="700" fill="#0f172a">What it does</text>
    <text x="80" y="83" fill="#64748b">One sentence. No technology in it &#8212; a person should understand it.</text>

    <rect x="30" y="100" width="660" height="46" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <circle cx="54" cy="123" r="14" fill="#2563eb"/><text x="54" y="128" text-anchor="middle" fill="#fff" font-weight="700" font-size="13">2</text>
    <text x="80" y="120" font-size="13" font-weight="700" fill="#0f172a">The interesting decision &#8212; and the alternative you rejected</text>
    <text x="80" y="137" fill="#64748b">A decision with no rejected alternative was not a decision.</text>

    <rect x="30" y="154" width="660" height="46" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <circle cx="54" cy="177" r="14" fill="#d97706"/><text x="54" y="182" text-anchor="middle" fill="#fff" font-weight="700" font-size="13">3</text>
    <text x="80" y="174" font-size="13" font-weight="700" fill="#0f172a">What went wrong &#8212; a specific bug, named</text>
    <text x="80" y="191" fill="#92400e">The one people skip and the one that lands. Only somebody who built it can tell you this.</text>

    <rect x="30" y="208" width="660" height="46" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <circle cx="54" cy="231" r="14" fill="#2563eb"/><text x="54" y="236" text-anchor="middle" fill="#fff" font-weight="700" font-size="13">4</text>
    <text x="80" y="228" font-size="13" font-weight="700" fill="#0f172a">What you would do next &#8212; one thing, with a reason</text>
    <text x="80" y="245" fill="#64748b">Shows you know the limits of your own work.</text>
  </g>

  <text x="360" y="272" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#991b1b">Rehearse the story, not the words. A memorised paragraph collapses at the first interruption &#8212; and you will be interrupted.</text>
</svg>
